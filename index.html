<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>同词相遇 💕 双人默契小游戏</title>
<style>
  /* ===== 全局样式：明亮、圆润、可爱 ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: linear-gradient(145deg, #fff9e6 0%, #ffe6f0 55%, #e8f5ff 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .game-container {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 44px;
    box-shadow: 0 20px 44px rgba(255, 150, 180, 0.28), 0 8px 20px rgba(255, 200, 220, 0.42);
    padding: 26px 20px 28px;
    border: 2px solid #fff0f5;
    animation: popIn 0.5s cubic-bezier(0.3, 1.4, 0.6, 1);
  }

  @keyframes popIn {
    from { transform: scale(0.94); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  h1 {
    font-size: 1.85rem;
    text-align: center;
    color: #ff6f91;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
    text-shadow: 0 4px 8px #ffe2e9;
  }

  h1 span { font-size: 1.6rem; }

  .subhead {
    text-align: center;
    color: #b68b9c;
    font-size: 0.85rem;
    margin: 0 auto 16px;
    background: #fff0f5;
    display: block;
    padding: 6px 18px;
    border-radius: 30px;
    letter-spacing: 1px;
    width: fit-content;
    border: 1px dashed #ffb6c1;
  }

  /* ===== 连接状态条 ===== */
  .conn-status {
    text-align: center;
    font-size: 0.78rem;
    color: #a78a97;
    background: #fdf2f6;
    border-radius: 30px;
    padding: 7px 14px;
    margin-bottom: 14px;
    border: 1px solid #ffe2ea;
    transition: all 0.3s;
  }
  .conn-status.ok { color: #3a9268; background: #e8f9f0; border-color: #bce9d2; }
  .conn-status.err { color: #c9586f; background: #ffeef2; border-color: #ffc7d4; }

  /* ===== 按钮通用 ===== */
  button {
    border: none;
    cursor: pointer;
    font-weight: 700;
    transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
    -webkit-user-select: none;
    user-select: none;
  }

  button:disabled {
    opacity: 0.45;
    pointer-events: none;
    cursor: not-allowed;
  }

  /* 创建房间按钮 */
  .create-room-btn {
    background: linear-gradient(180deg, #ffb6c1, #ff9db0);
    color: #fff;
    font-size: 1.15rem;
    padding: 17px 20px;
    width: 100%;
    border-radius: 60px;
    box-shadow: 0 8px 0 #d98a9b, 0 12px 20px #ffd3df;
    letter-spacing: 2px;
    text-shadow: 0 1px 3px #d97a90;
  }
  .create-room-btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #d98a9b, 0 6px 12px #ffd3df;
  }

  /* ===== 房间区域 ===== */
  .room-area {
    background: #fff6f9;
    border-radius: 30px;
    padding: 14px 16px;
    margin-bottom: 16px;
    border: 2px solid #ffdae0;
    animation: popIn 0.35s ease;
  }

  .room-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .room-badge {
    background: linear-gradient(180deg, #ffb6c1, #ff9db0);
    color: #fff;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 40px;
    font-size: 0.95rem;
    letter-spacing: 1px;
    box-shadow: 0 4px 0 #e09aa9;
    word-break: break-all;
    text-shadow: 0 1px 2px #d97a90;
  }

  .invite-btn {
    background: linear-gradient(180deg, #ffe066, #ffd23f);
    color: #8a6220;
    padding: 9px 18px;
    font-size: 0.9rem;
    border-radius: 40px;
    box-shadow: 0 5px 0 #e0b93c;
  }
  .invite-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #e0b93c;
  }

  .room-hint {
    font-size: 0.75rem;
    color: #c9a3b0;
    margin-top: 9px;
    text-align: center;
  }

  /* ===== 游戏区域 ===== */
  .word-section {
    background: #fffafc;
    border-radius: 32px;
    padding: 18px 14px;
    margin-bottom: 14px;
    border: 3px solid #ffe1e8;
    box-shadow: inset 0 0 0 4px #fff;
  }

  .turn-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .round-badge {
    background: #ffcad4;
    padding: 5px 14px;
    border-radius: 30px;
    color: #a34e62;
    font-weight: 700;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  #playerStatus {
    font-size: 0.82rem;
    color: #c2839a;
    font-weight: 600;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .word-input {
    width: 100%;
    padding: 16px 20px;
    border-radius: 60px;
    border: 3px solid #ffb7c5;
    background: #fff;
    font-size: 1.15rem;
    text-align: center;
    outline: none;
    color: #5e3e4a;
    font-weight: 600;
    letter-spacing: 1px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .word-input:focus {
    border-color: #ff6f91;
    box-shadow: 0 0 0 6px #ffe2e9;
  }
  .word-input:disabled {
    background: #fdf3f6;
    color: #bda3ae;
    border-color: #ffdde4;
  }
  .word-input::placeholder {
    color: #dcbcc6;
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0;
  }

  .submit-btn {
    background: linear-gradient(180deg, #8bd3dd, #6dc4d0);
    color: #15505a;
    font-size: 1.05rem;
    padding: 15px;
    border-radius: 60px;
    box-shadow: 0 6px 0 #579aa6, 0 8px 14px #cdeff3;
    letter-spacing: 1px;
  }
  .submit-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #579aa6, 0 4px 8px #cdeff3;
  }

  /* 上一轮展示 */
  .last-round-box {
    background: #fff2f6;
    border-radius: 26px;
    padding: 13px 15px;
    margin-top: 16px;
    border-left: 7px solid #ffb7c5;
  }

  .last-round-title {
    font-weight: 700;
    color: #ff6f91;
    font-size: 0.88rem;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 9px;
  }

  .last-round-words {
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 6px;
    font-weight: 700;
  }

  .last-round-words span {
    background: #fff;
    padding: 7px 14px;
    border-radius: 40px;
    box-shadow: 0 2px 6px #ffd9e2;
    color: #b3536b;
    min-width: 70px;
    text-align: center;
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 130px;
  }

  /* ===== 操作按钮 ===== */
  .action-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .agree-btn {
    background: linear-gradient(180deg, #b0e9ca, #8fdcb5);
    color: #1f6446;
    padding: 15px 12px;
    flex: 1;
    font-size: 0.92rem;
    border-radius: 40px;
    box-shadow: 0 6px 0 #79c6a0;
    letter-spacing: 0.5px;
  }
  .agree-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #79c6a0;
  }

  .restart-btn {
    background: linear-gradient(180deg, #ffd966, #ffcc33);
    color: #7d5614;
    padding: 15px 12px;
    flex: 1;
    font-size: 0.92rem;
    border-radius: 40px;
    box-shadow: 0 6px 0 #dcb03a;
    letter-spacing: 0.5px;
  }
  .restart-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #dcb03a;
  }

  /* ===== 历史面板 ===== */
  .history-panel {
    background: #fff5f8;
    border-radius: 30px;
    padding: 18px 14px;
    border: 2px solid #ffd9e2;
  }

  .history-title {
    font-size: 1.05rem;
    color: #ff6f91;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    font-weight: 700;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 240px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .history-list::-webkit-scrollbar { width: 5px; }
  .history-list::-webkit-scrollbar-thumb {
    background: #ffc7d4; border-radius: 10px;
  }

  .history-item {
    background: #fff;
    padding: 10px 14px;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    color: #694e58;
    box-shadow: 0 3px 6px #ffe2ea;
    border: 1px solid #ffe2ea;
    font-size: 0.88rem;
    animation: popIn 0.3s ease;
  }

  .history-item .round-num {
    color: #ff8da1;
    font-weight: 700;
    font-size: 0.8rem;
    white-space: nowrap;
    margin-right: 8px;
  }

  .history-item .words {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .history-item .words span {
    background: #fef0f4;
    padding: 3px 11px;
    border-radius: 30px;
    color: #b3536b;
    font-weight: 700;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty-history {
    text-align: center;
    color: #dcb9c4;
    padding: 14px 8px;
    font-size: 0.85rem;
  }

  /* 成功信息 */
  .success-message {
    text-align: center;
    font-size: 1.35rem;
    color: #ff6f91;
    font-weight: 800;
    margin: 14px 0 6px;
    line-height: 1.5;
    text-shadow: 0 4px 8px #ffd3df;
    animation: popIn 0.45s cubic-bezier(0.3, 1.5, 0.6, 1);
  }
  .success-message small {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #c2839a;
    margin-top: 6px;
    text-shadow: none;
  }

  /* 再来一把 */
  .again-btn {
    background: linear-gradient(180deg, #ffb6c1, #ff9db0);
    color: #fff;
    font-size: 1.15rem;
    padding: 16px;
    width: 100%;
    border-radius: 60px;
    box-shadow: 0 8px 0 #d98a9b, 0 10px 18px #ffd3df;
    margin-top: 14px;
    letter-spacing: 2px;
    text-shadow: 0 1px 3px #d97a90;
  }
  .again-btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #d98a9b;
  }

  /* ===== 工具类 ===== */
  .hidden { display: none !important; }

  /* 浮动提示 */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: #ff9db0;
    color: #fff;
    font-weight: 700;
    font-size: 0.92rem;
    padding: 12px 26px;
    border-radius: 40px;
    box-shadow: 0 10px 24px rgba(255, 130, 160, 0.5);
    transition: opacity 0.3s, transform 0.3s;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="game-container">
  <!-- 标题 -->
  <h1><span>🌸</span> 同词相遇 <span>🌸</span></h1>
  <div class="subhead">✨ 心有灵犀一点通 ✨</div>

  <!-- 连接状态 -->
  <div class="conn-status" id="connStatus">未连接</div>

  <!-- 创建房间按钮（初始显示） -->
  <button class="create-room-btn" id="createRoomBtn">🏠 创建房间</button>

  <!-- 房间信息区（创建/加入后显示） -->
  <div id="roomArea" class="room-area hidden">
    <div class="room-info">
      <div class="room-badge" id="roomIdDisplay">房间: ---</div>
      <button class="invite-btn" id="inviteBtn">📋 邀请好友</button>
    </div>
    <div class="room-hint">点击邀请自动复制链接，发给好友即可加入</div>
  </div>

  <!-- 游戏主区域 -->
  <div id="gamePlayArea" class="hidden">
    <!-- 输入区 -->
    <div class="word-section">
      <div class="turn-indicator">
        <span class="round-badge" id="roundCounter">第 1 轮</span>
        <span id="playerStatus">准备中...</span>
      </div>

      <div class="input-group">
        <input type="text" class="word-input" id="wordInput"
               placeholder="输入你想的词..." maxlength="20" autocomplete="off">
        <button class="submit-btn" id="submitWordBtn">提交 ✨</button>
      </div>

      <!-- 上一轮 / 本轮结果 -->
      <div class="last-round-box">
        <div class="last-round-title">
          <span>🕊️</span> <span id="lastRoundTitle">上一轮输入</span>
        </div>
        <div class="last-round-words">
          <span id="lastP1Word">——</span>
          <span>💞</span>
          <span id="lastP2Word">——</span>
        </div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-buttons">
      <button class="agree-btn" id="agreeBtn" disabled>✅ 认为词一样</button>
      <button class="restart-btn" id="restartRoundBtn">🔄 全部重来</button>
    </div>

    <!-- 历史记录 / 结束界面 -->
    <div class="history-panel">
      <div class="history-title"><span>📜</span> 相遇轨迹 <span>📜</span></div>
      <div class="history-list" id="historyList">
        <div class="empty-history">还没有记录，开始第一轮吧 ✨</div>
      </div>
      <div id="successMessage" class="success-message hidden"></div>
      <button id="againBtn" class="again-btn hidden">🌸 再来一把</button>
    </div>
  </div>

  <!-- 浮动提示 -->
  <div class="toast" id="toast"></div>
</div>

<!-- PeerJS：免费公共信令服务器，用于 WebRTC 建立点对点连接 -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  一、全局状态
   * ========================================================= */
  let peer = null;          // PeerJS 实例
  let conn = null;          // 数据连接
  let isHost = false;       // 是否是房主
  let myRole = 'p1';        // 自己的角色：p1 或 p2
  let roomId = '';          // 当前房间号
  let state = null;         // 游戏状态（房主权威，客户端镜像）
  let retryCount = 0;       // 客户端连接重试次数
  let nextRoundTimer = null;// 词不同时自动进入下一轮的定时器（仅房主端）

  /* =========================================================
   *  二、DOM 引用
   * ========================================================= */
  const $ = (id) => document.getElementById(id);

  const createRoomBtn   = $('createRoomBtn');
  const roomArea        = $('roomArea');
  const roomIdDisplay   = $('roomIdDisplay');
  const inviteBtn       = $('inviteBtn');
  const gamePlayArea    = $('gamePlayArea');
  const connStatus      = $('connStatus');
  const roundCounter    = $('roundCounter');
  const playerStatus    = $('playerStatus');
  const wordInput       = $('wordInput');
  const submitWordBtn   = $('submitWordBtn');
  const lastRoundTitle  = $('lastRoundTitle');
  const lastP1Word      = $('lastP1Word');
  const lastP2Word      = $('lastP2Word');
  const agreeBtn        = $('agreeBtn');
  const restartRoundBtn = $('restartRoundBtn');
  const historyList     = $('historyList');
  const successMessage  = $('successMessage');
  const againBtn        = $('againBtn');
  const toast           = $('toast');

  /* =========================================================
   *  三、工具函数
   * ========================================================= */

  let toastTimer = null;
  function showToast(msg, duration = 2200) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
  }

  function setConnStatus(text, type) {
    connStatus.textContent = text;
    connStatus.classList.remove('ok', 'err');
    if (type === 'ok') connStatus.classList.add('ok');
    if (type === 'err') connStatus.classList.add('err');
  }

  // 生成 6 位房间号
  function genRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  // 初始游戏状态
  function initialState() {
    return {
      round: 1,
      p1: { word: '', submitted: false, agreed: false },
      p2: { word: '', submitted: false, agreed: false },
      lastP1: '',
      lastP2: '',
      history: [],
      gameOver: false,
      pendingNextRound: false   // 双方已提交且词不同，等待自动下一轮
    };
  }

  function clearNextTimer() {
    if (nextRoundTimer) {
      clearTimeout(nextRoundTimer);
      nextRoundTimer = null;
    }
  }

  /* =========================================================
   *  四、房主权威逻辑
   * ========================================================= */

  // 把本轮词写入历史（防重复）
  function pushHistoryIfNeeded() {
    if (!state) return;
    if (state.history.some(h => h.round === state.round)) return;
    state.history.push({
      round: state.round,
      p1: state.p1.word,
      p2: state.p2.word
    });
  }

  // 本轮成功：记录历史，结束游戏
  function finishRound() {
    clearNextTimer();
    pushHistoryIfNeeded();
    state.lastP1 = state.p1.word;
    state.lastP2 = state.p2.word;
    state.gameOver = true;
    state.pendingNextRound = false;
  }

  // 进入下一轮：记录上一轮，重置双方提交状态
  function goNextRound() {
    clearNextTimer();
    pushHistoryIfNeeded();
    state.lastP1 = state.p1.word;
    state.lastP2 = state.p2.word;
    state.round += 1;
    state.p1 = { word: '', submitted: false, agreed: false };
    state.p2 = { word: '', submitted: false, agreed: false };
    state.pendingNextRound = false;
  }

  // 一方提交后检查本轮情况
  function afterSubmit() {
    if (!state.p1.submitted || !state.p2.submitted) return;

    if (state.p1.word === state.p2.word) {
      // 词相同 → 自动成功结束
      finishRound();
    } else {
      // 词不同 → 标记等待，2 秒后自动进入下一轮
      // 期间双方都可点“认为词一样”，双方都认同则提前结束
      state.pendingNextRound = true;
      clearNextTimer();
      nextRoundTimer = setTimeout(() => {
        nextRoundTimer = null;
        if (!state || state.gameOver) return;
        goNextRound();
        broadcastState();
        render();
      }, 2000);
    }
  }

  // 处理一个动作（role: 'p1' 或 'p2'）
  function handleAction(role, action, data) {
    if (!isHost) return;
    if (!state) state = initialState();

    const isP1 = role === 'p1';
    const mySlot = isP1 ? state.p1 : state.p2;

    if (action === 'submit') {
      if (state.gameOver || state.pendingNextRound) return;
      if (mySlot.submitted) return;
      const word = ((data && data.word) || '').trim().slice(0, 20);
      if (!word) return;
      mySlot.word = word;
      mySlot.submitted = true;
      afterSubmit();

    } else if (action === 'agree') {
      // 认为词一样：只有等待下一轮期间可用，且需双方都认同
      if (state.gameOver || !state.pendingNextRound) return;
      if (mySlot.agreed) return;
      mySlot.agreed = true;
      if (state.p1.agreed && state.p2.agreed) {
        // 双方都认同 → 立即成功结束
        finishRound();
      }
      // 只有一方认同则继续等待自动下一轮

    } else if (action === 'restart' || action === 'again') {
      // 全部重来（重置所有内容）
      clearNextTimer();
      state = initialState();
    }

    broadcastState();
    render();
  }

  // 房主广播状态给客户端
  function broadcastState() {
    if (isHost && conn && conn.open && state) {
      try {
        conn.send({ type: 'state', state: state });
      } catch (e) { /* 忽略 */ }
    }
  }

  // 发起动作（房主本地执行，客户端发消息给房主）
  function sendAction(action, data) {
    if (isHost) {
      handleAction(myRole, action, data);
    } else {
      if (conn && conn.open) {
        try {
          conn.send({ type: 'action', action: action, data: data || {} });
        } catch (e) {
          showToast('发送失败，请检查连接');
        }
      } else {
        showToast('连接尚未就绪，请稍候');
      }
    }
  }

  /* =========================================================
   *  五、PeerJS 连接管理
   * ========================================================= */

  function createRoom() {
    isHost = true;
    myRole = 'p1';
    const code = genRoomCode();
    roomId = code;

    setConnStatus('正在创建房间...');
    createRoomBtn.disabled = true;

    // 固定前缀 + 房间号作为 PeerJS ID，保证别人能连上
    peer = new Peer('tongci-' + code, { debug: 0 });

    peer.on('open', () => {
      state = initialState();
      showRoomUI();
      render();
      setConnStatus('房间已创建，等待好友加入...', 'ok');
      showToast('房间创建成功！点击「邀请好友」');
    });

    peer.on('connection', (connection) => {
      // 只接受一个连接
      if (conn && conn.open) {
        try { connection.close(); } catch (e) {}
        return;
      }
      conn = connection;
      setupConnection();
    });

    peer.on('error', handlePeerError);
  }

  function joinRoom(code) {
    isHost = false;
    myRole = 'p2';
    roomId = code.toUpperCase();
    retryCount = 0;

    setConnStatus('正在连接房间 ' + roomId + ' ...');
    createRoomBtn.disabled = true;

    peer = new Peer(null, { debug: 0 });

    peer.on('open', () => {
      showRoomUI();
      connectToHost();
    });

    peer.on('error', handlePeerError);
  }

  function connectToHost() {
    if (!peer || peer.destroyed) return;
    if (conn && conn.open) return;

    try {
      conn = peer.connect('tongci-' + roomId, { reliable: true });
      setupConnection();
    } catch (e) {
      console.error(e);
    }
  }

  function setupConnection() {
    if (!conn) return;

    conn.on('open', () => {
      setConnStatus('已连接 ✅', 'ok');
      if (isHost) {
        // 房主把当前状态同步给新加入的玩家
        broadcastState();
      }
      render();
    });

    conn.on('data', (data) => {
      if (!data || typeof data !== 'object') return;

      if (isHost) {
        // 房主接收客户端动作
        if (data.type === 'action') {
          handleAction('p2', data.action, data.data);
        }
      } else {
        // 客户端接收房主状态
        if (data.type === 'state' && data.state) {
          state = data.state;
          render();
        }
      }
    });

    conn.on('close', () => {
      setConnStatus('连接已断开', 'err');
      showToast('对方已离开，连接断开');
      render();
    });

    conn.on('error', (err) => {
      console.error('[Conn Error]', err);
    });
  }

  function handlePeerError(err) {
    console.error('[PeerJS Error]', err);

    if (err.type === 'peer-unavailable') {
      if (!isHost) {
        if (retryCount < 10) {
          retryCount++;
          setConnStatus('等待房主上线... (' + retryCount + '/10)');
          setTimeout(() => {
            if (!conn || !conn.open) connectToHost();
          }, 2500);
        } else {
          setConnStatus('无法连接，请确认房间号或让房主重新创建', 'err');
          showToast('找不到该房间，请确认链接是否正确');
        }
      }
    } else if (err.type === 'unavailable-id') {
      setConnStatus('房间号被占用，请重新创建', 'err');
      showToast('房间号冲突，请重新创建房间');
      createRoomBtn.disabled = false;
    } else if (err.type === 'network' || err.type === 'server-error') {
      setConnStatus('网络错误，请检查网络后刷新', 'err');
    } else {
      setConnStatus('连接异常: ' + err.type, 'err');
    }
  }

  /* =========================================================
   *  六、界面切换与渲染
   * ========================================================= */

  function showRoomUI() {
    createRoomBtn.classList.add('hidden');
    roomArea.classList.remove('hidden');
    gamePlayArea.classList.remove('hidden');
    roomIdDisplay.textContent = (isHost ? '🏠 房间: ' : '👤 房间: ') + roomId;
  }

  function render() {
    if (!state) return;

    const me = (myRole === 'p1') ? state.p1 : state.p2;

    roundCounter.textContent = '第 ' + state.round + ' 轮';

    /* ---------- 游戏已结束 ---------- */
    if (state.gameOver) {
      wordInput.disabled = true;
      submitWordBtn.disabled = true;
      agreeBtn.classList.add('hidden');
      restartRoundBtn.classList.add('hidden');
      againBtn.classList.remove('hidden');

      const rounds = state.history.length;
      successMessage.classList.remove('hidden');
      successMessage.innerHTML =
        '🎉 成功相遇！ 🎉' +
        '<small>经过 ' + rounds + ' 轮，你们选择了相同的词</small>';

      playerStatus.textContent = '游戏结束 🎊';
      lastRoundTitle.textContent = '最终选择';
      lastP1Word.textContent = state.lastP1 || '——';
      lastP2Word.textContent = state.lastP2 || '——';

      renderHistory();
      return;
    }

    /* ---------- 游戏进行中 ---------- */
    successMessage.classList.add('hidden');
    againBtn.classList.add('hidden');
    agreeBtn.classList.remove('hidden');
    restartRoundBtn.classList.remove('hidden');
    restartRoundBtn.textContent = '🔄 全部重来';
    restartRoundBtn.disabled = false;

    if (state.pendingNextRound) {
      // 双方已提交但词不同，等待自动进入下一轮
      wordInput.disabled = true;
      submitWordBtn.disabled = true;

      lastRoundTitle.textContent = '本轮输入';
      lastP1Word.textContent = state.p1.word || '——';
      lastP2Word.textContent = state.p2.word || '——';

      playerStatus.textContent = '词语不同，即将进入下一轮...';

      // 认同按钮：自己已认同则禁用并提示等待对方
      if (me.agreed) {
        agreeBtn.textContent = '✔ 已认同，等待对方';
        agreeBtn.disabled = true;
      } else {
        agreeBtn.textContent = '✅ 认为词一样';
        agreeBtn.disabled = false;
      }

    } else {
      // 正常提交阶段
      if (me.submitted) {
        wordInput.disabled = true;
        submitWordBtn.disabled = true;
        playerStatus.textContent = '✅ 你已提交，等待对方...';
      } else {
        wordInput.disabled = false;
        submitWordBtn.disabled = false;
        if (!(myRole === 'p1' ? state.p2.submitted : state.p1.submitted)) {
          playerStatus.textContent = '轮到你了，输入一个词吧';
        } else {
          playerStatus.textContent = '⏳ 对方已提交，等你啦';
        }
      }

      lastRoundTitle.textContent = '上一轮输入';
      lastP1Word.textContent = state.lastP1 || '——';
      lastP2Word.textContent = state.lastP2 || '——';

      agreeBtn.textContent = '✅ 认为词一样';
      agreeBtn.disabled = true;
    }

    renderHistory();
  }

  function renderHistory() {
    if (!state || !state.history || state.history.length === 0) {
      historyList.innerHTML = '<div class="empty-history">还没有记录，开始第一轮吧 ✨</div>';
      return;
    }

    let html = '';
    state.history.forEach(function (item) {
      html +=
        '<div class="history-item">' +
          '<span class="round-num">第' + item.round + '轮</span>' +
          '<span class="words">' +
            '<span>' + escapeHtml(item.p1) + '</span>' +
            '<span>💞</span>' +
            '<span>' + escapeHtml(item.p2) + '</span>' +
          '</span>' +
        '</div>';
    });
    historyList.innerHTML = html;
  }

  function escapeHtml(str) {
    if (!str) return '——';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* =========================================================
   *  七、事件绑定
   * ========================================================= */

  createRoomBtn.addEventListener('click', function () {
    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch (e) {}
      peer = null;
    }
    conn = null;
    state = null;
    clearNextTimer();
    createRoom();
  });

  inviteBtn.addEventListener('click', function () {
    if (!roomId) {
      showToast('房间尚未创建完成');
      return;
    }

    const url = new URL(window.location.href);
    url.searchParams.set('room', roomId);
    url.hash = '';
    const link = url.toString();

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link)
        .then(function () { showToast('🔗 邀请链接已复制！发给好友吧'); })
        .catch(function () { fallbackCopy(link); });
    } else {
      fallbackCopy(link);
    }
  });

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('🔗 邀请链接已复制！');
    } catch (e) {
      window.prompt('请手动复制下面的链接：', text);
    }
    document.body.removeChild(ta);
  }

  submitWordBtn.addEventListener('click', function () {
    if (!state) { showToast('游戏尚未开始'); return; }

    const word = wordInput.value.trim();
    if (!word) {
      showToast('请输入一个词哦～');
      wordInput.focus();
      return;
    }

    const me = (myRole === 'p1') ? state.p1 : state.p2;
    if (me.submitted) {
      showToast('你已经提交过啦');
      return;
    }

    wordInput.value = '';
    sendAction('submit', { word: word });
  });

  wordInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitWordBtn.click();
    }
  });

  // 认为词一样（需双方都认同才结束）
  agreeBtn.addEventListener('click', function () {
    sendAction('agree');
  });

  // 全部重来（重置所有内容）
  restartRoundBtn.addEventListener('click', function () {
    sendAction('restart');
    wordInput.value = '';
    showToast('已全部重来 🌱');
  });

  // 再来一把（结束后重置）
  againBtn.addEventListener('click', function () {
    sendAction('again');
    wordInput.value = '';
    showToast('新的一局开始啦 🌸');
  });

  /* =========================================================
   *  八、页面初始化
   * ========================================================= */
  window.addEventListener('DOMContentLoaded', function () {
    const params = new URLSearchParams(window.location.search);
    const roomFromUrl = params.get('room');

    if (roomFromUrl && roomFromUrl.trim()) {
      joinRoom(roomFromUrl.trim().toUpperCase());
    } else {
      setConnStatus('点击下方按钮创建房间');
      render();
    }
  });

  window.addEventListener('beforeunload', function () {
    clearNextTimer();
    try {
      if (conn) conn.close();
      if (peer) peer.destroy();
    } catch (e) {}
  });

})();
</script>
</body>
</html>
