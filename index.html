<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同词游戏｜联机房间</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      padding: 40px 20px;
      max-width: 680px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 8px;
      color: #222;
    }
    .tip {
      color: #666;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      background-color: #4080ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover {
      background-color: #2e6ee8;
    }
    .btn.secondary {
      background-color: white;
      color: #333;
      border: 1px solid #dcdfe6;
    }
    .hidden {
      display: none !important;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }
    .link-row {
      margin: 20px 0;
    }
    .link-row label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .link-wrap {
      display: flex;
      gap: 10px;
    }
    input#shareLink,
    input#guessInput,
    input#secretWordInput {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #dcdfe6;
      border-radius: 10px;
      font-size: 15px;
    }
    .message {
      margin-top: 16px;
      min-height: 26px;
      color: #2b9b49;
    }
    .warn {
      margin-top: 20px;
      padding: 16px;
      background-color: #eef4ff;
      border-radius: 12px;
      color: #2c5ea8;
    }
    .history-box {
      margin-top: 20px;
      height: 240px;
      overflow-y: auto;
      border: 1px solid #dcdfe6;
      border-radius: 12px;
      padding: 14px;
      background: #f8f9fb;
    }
    .history-item {
      margin-bottom: 10px;
      font-size: 14px;
    }
    .correct {
      color: #2b9b49;
      font-weight: bold;
    }
    .wrong {
      color: #888;
    }
  </style>
</head>
<body>
  <!-- 创建 / 加入页 -->
  <section id="startPage" class="card">
    <h1>同词游戏｜创建或加入房间</h1>
    <p class="tip">生成房间链接发给好友，一人出题，一人猜词</p >
    <button id="createRoomBtn" class="btn">创建新房间</button>
  </section>

  <!-- 房间页 -->
  <section id="roomPage" class="card hidden">
    <h1>房间已连接</h1>
    <p class="tip">把链接发给好友，同步进行游戏</p >

    <div class="link-row">
      <label>房间链接</label>
      <div class="link-wrap">
        <input id="shareLink" readonly>
        <button id="copyBtn" class="btn">复制链接</button>
      </div>
    </div>
    <div id="copyMsg" class="message"></div>

    <div class="warn">
      ✅ 通过公共 MQTT 联机测试；仅用于体验，不适合正式发布。
    </div>

    <div class="link-row">
      <label>设置目标词（出题人）</label>
      <div class="link-wrap">
        <input id="secretWordInput" placeholder="输入要对方猜的词">
        <button id="setWordBtn" class="btn">确定目标词</button>
      </div>
    </div>

    <div class="link-row">
      <label>提交猜测（猜词方）</label>
      <div class="link-wrap">
        <input id="guessInput" placeholder="输入猜测的词语">
        <button id="guessBtn" class="btn">提交猜测</button>
      </div>
    </div>

    <div class="link-row">
      <label>猜测记录</label>
      <div id="historyBox" class="history-box"></div>
    </div>

    <div style="margin-top:24px;">
      <button id="backBtn" class="btn secondary">返回，退出房间</button>
    </div>
  </section>

  <script>
    const startPage = document.getElementById('startPage');
    const roomPage = document.getElementById('roomPage');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const shareLinkInput = document.getElementById('shareLink');
    const copyBtn = document.getElementById('copyBtn');
    const copyMsg = document.getElementById('copyMsg');
    const backBtn = document.getElementById('backBtn');
    const historyBox = document.getElementById('historyBox');
    const secretWordInput = document.getElementById('secretWordInput');
    const setWordBtn = document.getElementById('setWordBtn');
    const guessInput = document.getElementById('guessInput');
    const guessBtn = document.getElementById('guessBtn');

    let client = null;
    let roomId = '';
    let targetWord = '';
    const broker = 'wss://broker.hivemq.com:8884/mqtt';

    function genRoomId(len = 8) {
      const chars = 'abcdefghijkmnpqrstuvwxyz0123456789';
      let id = '';
      for (let i = 0; i < len; i++) {
        id += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return id;
    }

    function addHistory(text, isCorrect = false) {
      const p = document.createElement('div');
      p.className = 'history-item ' + (isCorrect ? 'correct' : 'wrong');
      p.textContent = text;
      historyBox.appendChild(p);
      historyBox.scrollTop = historyBox.scrollHeight;
    }

    function clearHistory() {
      historyBox.innerHTML = '';
    }

    function showStartPage() {
      startPage.classList.remove('hidden');
      roomPage.classList.add('hidden');
      if (client) {
        client.end();
        client = null;
      }
      targetWord = '';
      clearHistory();
    }

    function showRoomPage(url) {
      shareLinkInput.value = url;
      copyMsg.textContent = '';
      startPage.classList.add('hidden');
      roomPage.classList.remove('hidden');
    }

    function publish(data) {
      if (!client) return;
      const topic = `game/room/${roomId}`;
      client.publish(topic, JSON.stringify(data));
    }

    async function connectRoom(rid) {
      roomId = rid;
      const url = location.origin + location.pathname + '?room=' + roomId;
      showRoomPage(url);
      clearHistory();

      try {
        client = mqtt.connect(broker, {
          clientId: 'game_' + Math.random().toString(36).substr(2, 10)
        });

        client.on('connect', () => {
          const topic = `game/room/${roomId}`;
          client.subscribe(topic);
          addHistory('✅ 已进入房间，可以开始游戏');
        });

        client.on('message', (_, raw) => {
          let payload;
          try {
            payload = JSON.parse(raw.toString());
          } catch {
            return;
          }
          handleRemote(payload);
        });

        client.on('error', (err) => {
          addHistory('❌ 连接出错：' + err.message);
        });

        client.on('close', () => {
          addHistory('🔌 房间连接断开');
        });
      } catch (e) {
        addHistory('❌ 创建房间失败：' + e.message);
      }
    }

      if (payload.type === 'set-target') {
        targetWord = payload.word.trim().toLowerCase();
        addHistory('📌 目标词已设置（对方已保存）');
