<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>同词相遇 💕 双人默契小游戏</title>
<style>
  /* ===== 全局样式：明亮、圆润、可爱 ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: linear-gradient(145deg, #fff9e6 0%, #ffe6f0 55%, #e8f5ff 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .game-container {
    width: 100%;
    max-width: 480px;
    position: relative;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 44px;
    box-shadow: 0 20px 44px rgba(255, 150, 180, 0.28), 0 8px 20px rgba(255, 200, 220, 0.42);
    padding: 26px 20px 28px;
    border: 2px solid #fff0f5;
    animation: popIn 0.5s cubic-bezier(0.3, 1.4, 0.6, 1);
  }

  @keyframes popIn {
    from { transform: scale(0.94); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* 右上角返回主页按钮 */
  .home-btn {
    position: absolute;
    top: 14px;
    right: 16px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.95);
    border: 2px solid #ffe2ea;
    border-radius: 50%;
    box-shadow: 0 4px 12px rgba(255, 150, 180, 0.3);
    cursor: pointer;
    z-index: 10;
    font-size: 1.15rem;
    transition: transform 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }
  .home-btn:active { transform: scale(0.9); }

  h1 {
    font-size: 1.85rem;
    text-align: center;
    color: #ff6f91;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
    text-shadow: 0 4px 8px #ffe2e9;
  }

  h1 span { font-size: 1.6rem; }

  .subhead {
    text-align: center;
    color: #b68b9c;
    font-size: 0.85rem;
    margin: 0 auto 16px;
    background: #fff0f5;
    display: block;
    padding: 6px 18px;
    border-radius: 30px;
    letter-spacing: 1px;
    width: fit-content;
    border: 1px dashed #ffb6c1;
  }

  /* ===== 连接状态条 ===== */
  .conn-status {
    text-align: center;
    font-size: 0.78rem;
    color: #a78a97;
    background: #fdf2f6;
    border-radius: 30px;
    padding: 7px 14px;
    margin-bottom: 14px;
    border: 1px solid #ffe2ea;
    transition: all 0.3s;
  }
  .conn-status.ok { color: #3a9268; background: #e8f9f0; border-color: #bce9d2; }
  .conn-status.err { color: #c9586f; background: #ffeef2; border-color: #ffc7d4; }

  /* ===== 按钮通用 ===== */
  button {
    border: none;
    cursor: pointer;
    font-weight: 700;
    transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
    -webkit-user-select: none;
    user-select: none;
  }

  button:disabled {
    opacity: 0.45;
    pointer-events: none;
    cursor: not-allowed;
  }

  /* 创建房间按钮 */
  .create-room-btn {
    background: linear-gradient(180deg, #ffb6c1, #ff9db0);
    color: #fff;
    font-size: 1.15rem;
    padding: 17px 20px;
    width: 100%;
    border-radius: 60px;
    box-shadow: 0 8px 0 #d98a9b, 0 12px 20px #ffd3df;
    letter-spacing: 2px;
    text-shadow: 0 1px 3px #d97a90;
  }
  .create-room-btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #d98a9b, 0 6px 12px #ffd3df;
  }

  /* ===== 输入房间号加入 ===== */
  .join-room-area {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .join-room-input {
    flex: 1;
    padding: 15px 18px;
    border-radius: 60px;
    border: 3px solid #ffb7c5;
    background: #fff;
    font-size: 1rem;
    text-align: center;
    outline: none;
    color: #5e3e4a;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    transition: border-color 0.2s, box-shadow 0.2s;
    min-width: 0;
  }
  .join-room-input:focus {
    border-color: #ff6f91;
    box-shadow: 0 0 0 6px #ffe2e9;
  }
  .join-room-input::placeholder {
    color: #dcbcc6;
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
  }
  .join-room-btn {
    background: linear-gradient(180deg, #b0e9ca, #8fdcb5);
    color: #1f6446;
    font-size: 1rem;
    padding: 15px 22px;
    border-radius: 60px;
    box-shadow: 0 6px 0 #79c6a0;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .join-room-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #79c6a0;
  }

  /* ===== 房间区域 ===== */
  .room-area {
    background: #fff6f9;
    border-radius: 30px;
    padding: 14px 16px;
    margin-bottom: 16px;
    border: 2px solid #ffdae0;
    animation: popIn 0.35s ease;
  }

  .room-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .room-badge {
    background: linear-gradient(180deg, #ffb6c1, #ff9db0);
    color: #fff;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 40px;
    font-size: 0.95rem;
    letter-spacing: 1px;
    box-shadow: 0 4px 0 #e09aa9;
    word-break: break-all;
    text-shadow: 0 1px 2px #d97a90;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }
  .room-badge:active {
    transform: scale(0.96) translateY(2px);
    box-shadow: 0 2px 0 #e09aa9;
  }

  .invite-btn {
    background: linear-gradient(180deg, #ffe066, #ffd23f);
    color: #8a6220;
    padding: 9px 18px;
    font-size: 0.9rem;
    border-radius: 40px;
    box-shadow: 0 5px 0 #e0b93c;
  }
  .invite-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #e0b93c;
  }

  .room-hint {
    font-size: 0.75rem;
    color: #c9a3b0;
    margin-top: 9px;
    text-align: center;
  }

  /* ===== 游戏区域 ===== */
  .word-section {
    background: #fffafc;
    border-radius: 32px;
    padding: 18px 14px;
    margin-bottom: 14px;
    border: 3px solid #ffe1e8;
    box-shadow: inset 0 0 0 4px #fff;
  }

  .turn-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .round-badge {
    background: #ffcad4;
    padding: 5px 14px;
    border-radius: 30px;
    color: #a34e62;
    font-weight: 700;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  #playerStatus {
    font-size: 0.82rem;
    color: #c2839a;
    font-weight: 600;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .word-input {
    width: 100%;
    padding: 16px 20px;
    border-radius: 60px;
    border: 3px solid #ffb7c5;
    background: #fff;
    font-size: 1.15rem;
    text-align: center;
    outline: none;
    color: #5e3e4a;
    font-weight: 600;
    letter-spacing: 1px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .word-input:focus {
    border-color: #ff6f91;
    box-shadow: 0 0 0 6px #ffe2e9;
  }
  .word-input:disabled {
    background: #fdf3f6;
    color: #bda3ae;
    border-color: #ffdde4;
  }
  .word-input::placeholder {
    color: #dcbcc6;
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0;
  }
  /* 对方已提交时，输入框轻微脉冲提醒 */
  .word-input.other-submitted {
    animation: pulseBorder 1.6s ease infinite;
  }
  @keyframes pulseBorder {
    0%, 100% { box-shadow: 0 0 0 6px rgba(255, 226, 233, 0.9); }
    50%      { box-shadow: 0 0 0 12px rgba(255, 208, 221, 0.55); }
  }

  .submit-btn {
    background: linear-gradient(180deg, #8bd3dd, #6dc4d0);
    color: #15505a;
    font-size: 1.05rem;
    padding: 15px;
    border-radius: 60px;
    box-shadow: 0 6px 0 #579aa6, 0 8px 14px #cdeff3;
    letter-spacing: 1px;
  }
  .submit-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #579aa6, 0 4px 8px #cdeff3;
  }

  /* 上一轮展示 */
  .last-round-box {
    background: #fff2f6;
    border-radius: 26px;
    padding: 13px 15px;
    margin-top: 16px;
    border-left: 7px solid #ffb7c5;
  }

  .last-round-title {
    font-weight: 700;
    color: #ff6f91;
    font-size: 0.88rem;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 9px;
  }

  .last-round-words {
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 6px;
    font-weight: 700;
  }

  .last-round-words span {
    background: #fff;
    padding: 7px 14px;
    border-radius: 40px;
    box-shadow: 0 2px 6px #ffd9e2;
    color: #b3536b;
    min-width: 70px;
    text-align: center;
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 130px;
  }

  /* ===== 操作按钮 ===== */
  .action-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .agree-btn {
    background: linear-gradient(180deg, #b0e9ca, #8fdcb5);
    color: #1f6446;
    padding: 15px 12px;
    flex: 1;
    font-size: 0.92rem;
    border-radius: 40px;
    box-shadow: 0 6px 0 #79c6a0;
    letter-spacing: 0.5px;
  }
  .agree-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #79c6a0;
  }

  .restart-btn {
    background: linear-gradient(180deg, #ffd966, #ffcc33);
    color: #7d5614;
    padding: 15px 12px;
    flex: 1;
    font-size: 0.92rem;
    border-radius: 40px;
    box-shadow: 0 6px 0 #dcb03a;
    letter-spacing: 0.5px;
  }
  .restart-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #dcb03a;
  }

  /* ===== 历史面板 ===== */
  .history-panel {
    background: #fff5f8;
    border-radius: 30px;
    padding: 18px 14px;
    border: 2px solid #ffd9e2;
  }

  .history-title {
    font-size: 1.05rem;
    color: #ff6f91;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    font-weight: 700;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 240px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .history-list::-webkit-scrollbar { width: 5px; }
  .history-list::-webkit-scrollbar-thumb {
    background: #ffc7d4; border-radius: 10px;
  }

  .history-item {
    background: #fff;
    padding: 10px 14px;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    color: #694e58;
    box-shadow: 0 3px 6px #ffe2ea;
    border: 1px solid #ffe2ea;
    font-size: 0.88rem;
    animation: popIn 0.3s ease;
  }

  .history-item .round-num {
    color: #ff8da1;
    font-weight: 700;
    font-size: 0.8rem;
    white-space: nowrap;
    margin-right: 8px;
  }

  .history-item .words {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .history-item .words span {
    background: #fef0f4;
    padding: 3px 11px;
    border-radius: 30px;
    color: #b3536b;
    font-weight: 700;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty-history {
    text-align: center;
    color: #dcb9c4;
    padding: 14px 8px;
    font-size: 0.85rem;
  }

  /* 成功信息 */
  .success-message {
    text-align: center;
    font-size: 1.35rem;
    color: #ff6f91;
    font-weight: 800;
    margin: 14px 0 6px;
    line-height: 1.5;
    text-shadow: 0 4px 8px #ffd3df;
    animation: popIn 0.45s cubic-bezier(0.3, 1.5, 0.6, 1);
  }
  .success-message small {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #c2839a;
    margin-top: 6px;
    text-shadow: none;
  }

  /* 再来一把 */
  .again-btn {
    background: linear-gradient(180deg, #ffb6c1, #ff9db0);
    color: #fff;
    font-size: 1.15rem;
    padding: 16px;
    width: 100%;
    border-radius: 60px;
    box-shadow: 0 8px 0 #d98a9b, 0 10px 18px #ffd3df;
    margin-top: 14px;
    letter-spacing: 2px;
    text-shadow: 0 1px 3px #d97a90;
  }
  .again-btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #d98a9b;
  }

  /* ===== 工具类 ===== */
  .hidden { display: none !important; }

  /* 浮动提示 */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: #ff9db0;
    color: #fff;
    font-weight: 700;
    font-size: 0.92rem;
    padding: 12px 26px;
    border-radius: 40px;
    box-shadow: 0 10px 24px rgba(255, 130, 160, 0.5);
    transition: opacity 0.3s, transform 0.3s;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== 结束弹窗 ===== */
  .result-modal {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }
  .result-modal-mask {
    position: absolute;
    inset: 0;
    background: rgba(60, 30, 45, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: fadeIn 0.25s ease;
  }
  .result-modal-card {
    position: relative;
    width: 100%;
    max-width: 400px;
    max-height: 88vh;
    background: #ffffff;
    border-radius: 32px;
    box-shadow: 0 20px 60px rgba(255, 150, 180, 0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: popIn 0.4s cubic-bezier(0.3, 1.4, 0.6, 1);
  }
  .result-modal-header {
    text-align: center;
    padding: 24px 20px 16px;
    background: linear-gradient(180deg, #fff5f8, #ffffff);
    flex-shrink: 0;
  }
  .result-modal-emoji {
    font-size: 2.4rem;
    margin-bottom: 4px;
    line-height: 1;
  }
  .result-modal-title {
    font-size: 1.5rem;
    font-weight: 800;
    color: #ff6f91;
    text-shadow: 0 4px 8px #ffe2e9;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .result-modal-sub {
    font-size: 0.85rem;
    color: #c2839a;
    font-weight: 600;
  }
  .result-modal-sub span {
    color: #ff6f91;
    font-weight: 800;
    font-size: 1rem;
  }
  .result-modal-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 60px;
    -webkit-overflow-scrolling: touch;
  }
  .result-modal-list::-webkit-scrollbar { width: 4px; }
  .result-modal-list::-webkit-scrollbar-thumb {
    background: #ffc7d4;
    border-radius: 10px;
  }
  .result-modal-item {
    background: #fff5f8;
    border: 1px solid #ffe2ea;
    border-radius: 20px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.88rem;
    font-weight: 600;
    gap: 8px;
    flex-shrink: 0;
  }
  .result-modal-item .round-tag {
    color: #ff8da1;
    font-size: 0.78rem;
    white-space: nowrap;
    flex-shrink: 0;
    font-weight: 700;
  }
  .result-modal-item .word-pair {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .result-modal-item .word-pair span {
    background: #ffffff;
    padding: 3px 12px;
    border-radius: 30px;
    color: #b3536b;
    font-weight: 700;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .result-modal-actions {
    padding: 16px 18px 20px;
    display: flex;
    gap: 10px;
    background: #ffffff;
    border-top: 1px solid #fff0f5;
    flex-shrink: 0;
  }
  .save-img-btn, .result-again-btn {
    flex: 1;
    padding: 14px 8px;
    border-radius: 40px;
    font-size: 0.95rem;
    letter-spacing: 1px;
  }
  .save-img-btn {
    background: linear-gradient(180deg, #8bd3dd, #6dc4d0);
    color: #15505a;
    box-shadow: 0 5px 0 #579aa6;
  }
  .save-img-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #579aa6;
  }
  .result-again-btn {
    background: linear-gradient(180deg, #ffb6c1, #ff9db0);
    color: #fff;
    box-shadow: 0 5px 0 #d98a9b;
    text-shadow: 0 1px 2px #d97a90;
  }
  .result-again-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #d98a9b;
  }

  /* ===== 图片预览（微信保存用） ===== */
  .img-preview-modal {
    position: fixed;
    inset: 0;
    z-index: 10001;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .img-preview-tip {
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 16px;
    background: rgba(255, 255, 255, 0.15);
    padding: 8px 20px;
    border-radius: 30px;
    animation: pulseTip 1.8s ease infinite;
    text-align: center;
  }
  @keyframes pulseTip {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .img-preview-wrap {
    max-width: 100%;
    max-height: 68vh;
    overflow: auto;
    border-radius: 16px;
    -webkit-overflow-scrolling: touch;
    background: #fff;
  }
  .img-preview-wrap img {
    display: block;
    max-width: 100%;
    border-radius: 16px;
  }
  .img-preview-close {
    margin-top: 20px;
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 10px 32px;
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="game-container">
  <!-- 右上角返回主页 -->
  <div class="home-btn hidden" id="homeBtn" title="返回主页">🏠</div>

  <!-- 标题 -->
  <h1><span>🌸</span> 同词相遇 <span>🌸</span></h1>
  <div class="subhead">✨ 心有灵犀一点通 ✨</div>

  <!-- 连接状态 -->
  <div class="conn-status" id="connStatus">未连接</div>

  <!-- 主页区：创建房间 + 输入房间号 -->
  <div id="homeArea">
    <button class="create-room-btn" id="createRoomBtn">🏠 创建房间</button>
    <div class="join-room-area">
      <input type="text" class="join-room-input" id="joinRoomInput"
             placeholder="输入房间号加入" maxlength="6" autocomplete="off">
      <button class="join-room-btn" id="joinRoomBtn">加入</button>
    </div>
  </div>

  <!-- 房间信息区（创建/加入后显示） -->
  <div id="roomArea" class="room-area hidden">
    <div class="room-info">

      <div class="history-list" id="historyList">

    <div class="img-preview-wrap">

    <button class="img-preview-close" id="imgPreviewClose">关闭</button>

<!-- PeerJS：免费公共信令服务器，用于 WebRTC 建立点对点连接 -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  一、全局状态
   * ========================================================= */
  let peer = null;              // PeerJS 实例
  let conn = null;              // 数据连接
  let isHost = false;           // 是否是房间主机
  let myRole = 'p1';            // 座位：'p1' 或 'p2'
  let roomId = '';              // 当前房间号
  let state = null;             // 游戏状态（主机权威，客户端镜像）
  let retryCount = 0;           // 客户端连接重试次数
  let nextRoundTimer = null;    // 词不同时自动下一轮的定时器
  let reconnectTimer = null;    // 客户端断线重连定时器
  let hostRestoreAttempt = 0;   // 主机恢复房间号的重试次数
  let takeoverAttempted = false;// 是否已尝试接管

  let resultModalShown = false; // 结束弹窗是否已经弹出（防止重复弹）

  const LS_IS_HOST = 'tongci_is_host';
  const LS_MY_ROLE = 'tongci_my_role';
  const LS_ROOM    = 'tongci_room';
  const LS_STATE   = 'tongci_state_';

  const TAKEOVER_THRESHOLD = 8;

  /* =========================================================
   *  二、DOM 引用
   * ========================================================= */
  const $ = (id) => document.getElementById(id);

  const homeBtn         = $('homeBtn');
  const homeArea        = $('homeArea');
  const createRoomBtn   = $('createRoomBtn');
  const joinRoomInput   = $('joinRoomInput');
  const joinRoomBtn     = $('joinRoomBtn');
  const roomArea        = $('roomArea');
  const roomIdDisplay   = $('roomIdDisplay');
  const inviteBtn       = $('inviteBtn');
  const gamePlayArea    = $('gamePlayArea');
  const connStatus      = $('connStatus');
  const roundCounter    = $('roundCounter');
  const playerStatus    = $('playerStatus');
  const wordInput       = $('wordInput');
  const submitWordBtn   = $('submitWordBtn');
  const lastRoundTitle  = $('lastRoundTitle');
  const lastP1Word      = $('lastP1Word');
  const lastP2Word      = $('lastP2Word');
  const agreeBtn        = $('agreeBtn');
  const restartRoundBtn = $('restartRoundBtn');
  const historyList     = $('historyList');
  const successMessage  = $('successMessage');
  const againBtn        = $('againBtn');
  const toast           = $('toast');

  // 结束弹窗相关
  const resultModal     = $('resultModal');
  const resultRounds    = $('resultRounds');
  const resultModalList = $('resultModalList');
  const saveImgBtn      = $('saveImgBtn');
  const resultAgainBtn  = $('resultAgainBtn');

  // 图片预览
  const imgPreviewModal = $('imgPreviewModal');
  const previewImg      = $('previewImg');
  const imgPreviewClose = $('imgPreviewClose');

  /* =========================================================
   *  三、工具函数
   * ========================================================= */

  let toastTimer = null;
  function showToast(msg, duration = 2200) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
  }

  function setConnStatus(text, type) {
    connStatus.textContent = text;
    connStatus.classList.remove('ok', 'err');
    if (type === 'ok') connStatus.classList.add('ok');
    if (type === 'err') connStatus.classList.add('err');
  }

  function genRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function escapeHtml(str) {
    if (!str) return '——';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function otherSeat(role) { return role === 'p1' ? 'p2' : 'p1'; }

  function isWeixin() {
    return /micromessenger/i.test(navigator.userAgent.toLowerCase());
  }

  function isMobile() {
    return /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent.toLowerCase());
  }

  function copyText(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () { showToast(successMsg || '已复制'); })
        .catch(function () { fallbackCopy(text, successMsg); });
    } else {
      fallbackCopy(text, successMsg);
    }
  }

  function fallbackCopy(text, successMsg) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast(successMsg || '已复制');
    } catch (e) {
      window.prompt('请手动复制下面的内容：', text);
    }
    document.body.removeChild(ta);
  }

  /* =========================================================
   *  四、会话持久化
   * ========================================================= */

  function saveSession() {
    try {
      if (roomId) {
        localStorage.setItem(LS_ROOM, roomId);
        localStorage.setItem(LS_IS_HOST, isHost ? 'true' : 'false');
        localStorage.setItem(LS_MY_ROLE, myRole);
      }
    } catch (e) {}
  }

  function saveStateSnapshot() {
    if (isHost && state && roomId) {
      try {
        localStorage.setItem(LS_STATE + roomId, JSON.stringify(state));
      } catch (e) {}
    }
  }

  function loadStateSnapshot() {
    if (!roomId) return null;
    try {
      const s = localStorage.getItem(LS_STATE + roomId);
      if (s) return JSON.parse(s);
    } catch (e) {}
    return null;
  }

  function clearSession() {
    try {
      localStorage.removeItem(LS_IS_HOST);
      localStorage.removeItem(LS_MY_ROLE);
      localStorage.removeItem(LS_ROOM);
      if (roomId) localStorage.removeItem(LS_STATE + roomId);
    } catch (e) {}
  }

  /* =========================================================
   *  五、游戏状态与主机权威逻辑
   * ========================================================= */

  function emptySeat() {
    return { word: '', submitted: false, agreed: false, online: false };
  }

  function initialState() {
    return {
      round: 1,
      p1: emptySeat(),
      p2: emptySeat(),
      lastP1: '',
      lastP2: '',
      history: [],
      gameOver: false,
      pendingNextRound: false
    };
  }

  function clearNextTimer() {
    if (nextRoundTimer) {
      clearTimeout(nextRoundTimer);
      nextRoundTimer = null;
    }
  }

  function pushHistoryIfNeeded() {
    if (!state) return;
    if (state.history.some(h => h.round === state.round)) return;
    state.history.push({
      round: state.round,
      p1: state.p1.word,
      p2: state.p2.word
    });
  }

  function finishRound() {
    clearNextTimer();
    pushHistoryIfNeeded();
    state.lastP1 = state.p1.word;
    state.lastP2 = state.p2.word;
    state.gameOver = true;
    state.pendingNextRound = false;
  }

  function goNextRound() {
    clearNextTimer();
    pushHistoryIfNeeded();
    state.lastP1 = state.p1.word;
    state.lastP2 = state.p2.word;
    state.round += 1;
    const p1Online = state.p1.online;
    const p2Online = state.p2.online;
    state.p1 = emptySeat();
    state.p2 = emptySeat();
    state.p1.online = p1Online;
    state.p2.online = p2Online;
    state.pendingNextRound = false;
  }

  function afterSubmit() {
    if (!state.p1.submitted || !state.p2.submitted) return;

    if (state.p1.word === state.p2.word) {
      finishRound();
    } else {
      state.pendingNextRound = true;
      clearNextTimer();
      nextRoundTimer = setTimeout(() => {
        nextRoundTimer = null;
        if (!state || state.gameOver) return;
        goNextRound();
        broadcastState();
        render();
      }, 2000);
    }
  }

  function handleAction(role, action, data) {
    if (!isHost) return;
    if (!state) state = initialState();

    const slot = state[role];
    if (!slot) return;

    if (action === 'submit') {
      if (state.gameOver || state.pendingNextRound) return;
      if (slot.submitted) return;
      const word = ((data && data.word) || '').trim().slice(0, 20);
      if (!word) return;
      slot.word = word;
      slot.submitted = true;
      afterSubmit();

    } else if (action === 'agree') {
      if (state.gameOver || !state.pendingNextRound) return;
      if (slot.agreed) return;
      slot.agreed = true;
      if (state.p1.agreed && state.p2.agreed) {
        finishRound();
      }

    } else if (action === 'restart' || action === 'again') {
      clearNextTimer();
      const p1Online = state.p1.online;
      const p2Online = state.p2.online;
      state = initialState();
      state.p1.online = p1Online;
      state.p2.online = p2Online;
    }

    broadcastState();
    render();
  }

  function broadcastState() {
    if (!isHost) return;
    saveStateSnapshot();
    if (conn && conn.open && state) {
      try { conn.send({ type: 'state', state: state }); } catch (e) {}
    }
  }

  function sendAction(action, data) {
    if (isHost) {
      handleAction(myRole, action, data);
    } else {
      if (conn && conn.open) {
        try {
          conn.send({
            type: 'action',
            role: myRole,
            action: action,
            data: data || {}
          });
        } catch (e) {
          showToast('发送失败，正在重连...');
          scheduleReconnect();
        }
      } else {
        showToast('连接尚未就绪，正在重连...');
        scheduleReconnect();
      }
    }
  }

  /* =========================================================
   *  六、连接处理
   * ========================================================= */

  function handleNewConnection(connection) {
    const other = otherSeat(myRole);

    if (conn && conn.open) {
      try { connection.close(); } catch (e) {}
      return;
    }
    if (state && state[other] && state[other].online) {
      try { connection.close(); } catch (e) {}
      return;
    }

    if (state) {
      state[other] = emptySeat();
      state[other].online = true;

      if (state.gameOver) {
        const myOnline = true;
        state = initialState();
        state[myRole].online = myOnline;
        state[other].online = true;
      }
    }

    conn = connection;
    setupConnection();

    conn.on('open', () => {
      try {
        conn.send({ type: 'assign', role: other });
        conn.send({ type: 'state', state: state });
      } catch (e) {}
      setConnStatus('已连接 ✅', 'ok');
      render();
    });

    broadcastState();
    render();
  }

  function setupConnection() {
    if (!conn) return;

    conn.on('data', (data) => {
      if (!data || typeof data !== 'object') return;

      if (isHost) {
        if (data.type === 'action') {
          handleAction(data.role || 'p2', data.action, data.data);
        } else if (data.type === 'hello') {
          broadcastState();
        } else if (data.type === 'ping') {
          try { conn.send({ type: 'pong' }); } catch (e) {}
        }
      } else {
        if (data.type === 'state' && data.state) {
          state = data.state;
          render();
        } else if (data.type === 'assign' && data.role) {
          myRole = data.role;
          wordInput.value = '';
          saveSession();
          render();
        } else if (data.type === 'ping') {
          try { conn.send({ type: 'pong' }); } catch (e) {}
        }
      }
    });

    conn.on('close', () => {
      if (isHost) {
        const other = otherSeat(myRole);
        if (state && state[other]) {
          state[other].online = false;
          state[other].submitted = false;
          state[other].agreed = false;
          state[other].word = '';
          broadcastState();
        }
        conn = null;
        setConnStatus('好友已断开，等待新玩家加入...', 'err');
        render();
      } else {
        conn = null;
        setConnStatus('连接断开，正在重连...', 'err');
        scheduleReconnect();
        render();
      }
    });

    conn.on('error', (err) => {
      console.error('[Conn Error]', err);
      if (!isHost) scheduleReconnect();
    });
  }

  /* =========================================================
   *  七、PeerJS：创建 / 加入 / 接管
   * ========================================================= */

  function createRoom() {
    isHost = true;
    myRole = 'p1';
    roomId = genRoomCode();
    hostRestoreAttempt = 0;
    takeoverAttempted = false;

    setConnStatus('正在创建房间...');
    createRoomBtn.disabled = true;

    peer = new Peer('tongci-' + roomId, { debug: 0 });

    peer.on('open', () => {
      state = initialState();
      state.p1.online = true;
      saveSession();
      saveStateSnapshot();

      updateURLRoom(roomId);
      showRoomUI();
      render();
      setConnStatus('房间已创建，等待好友加入...', 'ok');
      showToast('房间创建成功！点击「邀请好友」或分享房间号');
    });

    peer.on('connection', handleNewConnection);

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed) {
        try { peer.reconnect(); } catch (e) {}
      }
    });

    peer.on('error', handlePeerError);
  }

  function joinRoom(code) {
    isHost = false;
    myRole = 'p2';
    roomId = code.toUpperCase();
    retryCount = 0;
    takeoverAttempted = false;

    saveSession();
    updateURLRoom(roomId);

    setConnStatus('正在连接房间 ' + roomId + ' ...');
    createRoomBtn.disabled = true;
    joinRoomBtn.disabled = true;

    peer = new Peer(null, { debug: 0 });

    peer.on('open', () => {
      showRoomUI();
      connectToHost();
    });

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed) {
        try { peer.reconnect(); } catch (e) {}
      }
    });

    peer.on('error', handlePeerError);
  }

  function connectToHost() {
    if (!peer || peer.destroyed) return;
    if (conn && conn.open) return;

    if (conn) {
      try { conn.close(); } catch (e) {}
      conn = null;
    }

    try {
      conn = peer.connect('tongci-' + roomId, { reliable: true });
      setupConnection();
    } catch (e) {
      console.error(e);
    }
  }

  function scheduleReconnect() {
    if (isHost) return;
    if (reconnectTimer) return;

    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      if (!conn || !conn.open) {
        setConnStatus('正在重连房间...');
        connectToHost();
      }
    }, 2500);
  }

  function handlePeerError(err) {
    console.error('[PeerJS Error]', err);

    if (err.type === 'peer-unavailable') {
      if (!isHost) {
        retryCount++;
        if (retryCount < TAKEOVER_THRESHOLD) {
          setConnStatus('等待房主上线... (' + retryCount + '/' + TAKEOVER_THRESHOLD + ')');
          setTimeout(() => {
            if (!conn || !conn.open) connectToHost();
          }, 3000);
        } else if (!takeoverAttempted) {
          tryTakeover();
        }
      }
    } else if (err.type === 'unavailable-id') {
      if (!isHost) {
        setConnStatus('网络异常，请刷新重试', 'err');
      }
    } else if (err.type === 'network' || err.type === 'server-error') {
      setConnStatus('网络错误，正在重试...', 'err');
      if (!isHost) {
        setTimeout(() => {
          if (!conn || !conn.open) connectToHost();
        }, 3000);
      } else if (peer && peer.disconnected) {
        try { peer.reconnect(); } catch (e) {}
      }
    } else {
      setConnStatus('连接异常: ' + err.type, 'err');
    }
  }

  /* =========================================================
   *  八、接管
   * ========================================================= */

  function tryTakeover() {
    takeoverAttempted = true;
    setConnStatus('房主长时间未响应，正在接管房间...');

    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch (e) {}
    }

    peer = new Peer('tongci-' + roomId, { debug: 0 });

    peer.on('open', () => {
      isHost = true;

      const snapshot = loadStateSnapshot();
      state = snapshot || initialState();

      state[myRole].online = true;
      state[myRole].submitted = false;
      state[myRole].agreed = false;
      state[myRole].word = '';
      state[otherSeat(myRole)] = emptySeat();

      state.gameOver = false;
      state.pendingNextRound = false;

      saveSession();
      saveStateSnapshot();

      setConnStatus('房间已接管，等待新玩家加入...', 'ok');
      showToast('已接管房间，可以邀请新玩家加入');
      render();
    });

    peer.on('connection', handleNewConnection);

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed) {
        try { peer.reconnect(); } catch (e) {}
      }
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        setConnStatus('房主已上线，正在连接...');
        isHost = false;
        takeoverAttempted = false;
        retryCount = 0;

        if (peer && !peer.destroyed) {
          try { peer.destroy(); } catch (e) {}
        }

        peer = new Peer(null, { debug: 0 });
        peer.on('open', () => { connectToHost(); });
        peer.on('disconnected', () => {
          if (peer && !peer.destroyed) {
            try { peer.reconnect(); } catch (e) {}
          }
        });
        peer.on('error', handlePeerError);
      } else {
        handlePeerError(err);
      }
    });
  }

  /* =========================================================
   *  九、会话恢复
   * ========================================================= */

  function resumeHost() {
    isHost = true;
    hostRestoreAttempt = 0;
    takeoverAttempted = true;

    const snapshot = loadStateSnapshot();
    state = snapshot || initialState();

    state[myRole].online = true;
    state[myRole].submitted = false;
    state[myRole].agreed = false;
    state[myRole].word = '';

    const other = otherSeat(myRole);
    state[other] = emptySeat();

    if (state.pendingNextRound && !state.gameOver) {
      state.pendingNextRound = false;
    }

    saveSession();
    saveStateSnapshot();
    showRoomUI();
    render();
    setConnStatus('正在恢复房间...');

    setTimeout(createHostPeerWithRetry, 600);
  }

  function createHostPeerWithRetry() {
    if (hostRestoreAttempt > 8) {
      setConnStatus('恢复失败，请刷新重试', 'err');
      return;
    }
    hostRestoreAttempt++;

    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch (e) {}
    }

    peer = new Peer('tongci-' + roomId, { debug: 0 });

    peer.on('open', () => {
      setConnStatus('房间已恢复，等待好友加入...', 'ok');
      showToast('房间已恢复');
      hostRestoreAttempt = 0;
    });

    peer.on('connection', handleNewConnection);

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed) {
        try { peer.reconnect(); } catch (e) {}
      }
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        setConnStatus('房间恢复中，请稍候...');
        setTimeout(createHostPeerWithRetry, 2000);
      } else {
        handlePeerError(err);
      }
    });
  }

  function resumeClient() {
    isHost = false;
    retryCount = 0;
    takeoverAttempted = false;

    showRoomUI();
    setConnStatus('正在重连房间 ' + roomId + ' ...');
    render();

    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch (e) {}
    }

    peer = new Peer(null, { debug: 0 });

    peer.on('open', () => {
      connectToHost();
    });

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed) {
        try { peer.reconnect(); } catch (e) {}
      }
    });

    peer.on('error', handlePeerError);
  }

  /* =========================================================
   *  十、界面切换与渲染
   * ========================================================= */

  function updateURLRoom(code) {
    try {
      const url = new URL(window.location.href);
      if (code) url.searchParams.set('room', code);
      else url.searchParams.delete('room');
      url.hash = '';
      window.history.replaceState(null, '', url.toString());
    } catch (e) {}
  }

  function showRoomUI() {
    homeArea.classList.add('hidden');
    homeBtn.classList.remove('hidden');
    roomArea.classList.remove('hidden');
    gamePlayArea.classList.remove('hidden');
    roomIdDisplay.textContent = (isHost ? '🏠 房间: ' : '👤 房间: ') + roomId;
  }

  function showHomeUI() {
    homeArea.classList.remove('hidden');
    homeBtn.classList.add('hidden');
    roomArea.classList.add('hidden');
    gamePlayArea.classList.add('hidden');
  }

  function render() {
    if (!state) {
      wordInput.disabled = true;
      submitWordBtn.disabled = true;
      roundCounter.textContent = '第 — 轮';
      playerStatus.textContent = '正在同步游戏状态...';
      lastP1Word.textContent = '——';
      lastP2Word.textContent = '——';
      return;
    }

    const me = state[myRole];
    const other = state[otherSeat(myRole)];

    roundCounter.textContent = '第 ' + state.round + ' 轮';

    /* ---------- 游戏已结束 ---------- */
    if (state.gameOver) {
      wordInput.disabled = true;
      submitWordBtn.disabled = true;
      wordInput.classList.remove('other-submitted');
      agreeBtn.classList.add('hidden');
      restartRoundBtn.classList.add('hidden');
      againBtn.classList.remove('hidden');

      const rounds = state.history.length;
      successMessage.classList.remove('hidden');
      successMessage.innerHTML =
        '🎉 成功相遇！ 🎉' +
        '<small>经过 ' + rounds + ' 轮，你们选择了相同的词</small>';

      playerStatus.textContent = '游戏结束 🎊';
      lastRoundTitle.textContent = '最终选择';
      lastP1Word.textContent = state.lastP1 || '——';
      lastP2Word.textContent = state.lastP2 || '——';

      renderHistory();

      // 显示弹窗（每局只弹一次）
      if (!resultModalShown) {
        resultModalShown = true;
        setTimeout(function () {
          if (state && state.gameOver) showResultModal();
        }, 350);
      }
      return;
    }

    /* ---------- 游戏进行中 ---------- */
    // 一旦不再 gameOver，重置弹窗状态
    if (resultModalShown) {
      resultModalShown = false;
      hideResultModal();
    }

    successMessage.classList.add('hidden');
    againBtn.classList.add('hidden');
    agreeBtn.classList.remove('hidden');
    restartRoundBtn.classList.remove('hidden');
    restartRoundBtn.textContent = '🔄 全部重来';

    const otherOnline = other && other.online;

    if (state.pendingNextRound) {
      wordInput.disabled = true;
      submitWordBtn.disabled = true;
      wordInput.classList.remove('other-submitted');

      lastRoundTitle.textContent = '本轮输入';
      lastP1Word.textContent = state.p1.word || '——';
      lastP2Word.textContent = state.p2.word || '——';

      playerStatus.textContent = '词语不同，即将进入下一轮...';

      if (me.agreed) {
        agreeBtn.textContent = '✔ 已认同，等待对方';
        agreeBtn.disabled = true;
      } else {
        agreeBtn.textContent = '✅ 认为词一样';
        agreeBtn.disabled = false;
      }
    } else {
      if (me.submitted) {
        wordInput.disabled = true;
        submitWordBtn.disabled = true;
        wordInput.classList.remove('other-submitted');
        playerStatus.textContent = '✅ 你已提交，等待对方...';
      } else {
        wordInput.disabled = false;
        submitWordBtn.disabled = false;

        if (!otherOnline) {
          playerStatus.textContent = '⏳ 等待另一位玩家加入...';
          wordInput.classList.remove('other-submitted');
        } else if (other && other.submitted) {
          playerStatus.textContent = '⏳ 对方已提交，等你啦！';
          wordInput.classList.add('other-submitted');
        } else {
          playerStatus.textContent = '轮到你了，输入一个词吧';
          wordInput.classList.remove('other-submitted');
        }
      }

      lastRoundTitle.textContent = '上一轮输入';
      lastP1Word.textContent = state.lastP1 || '——';
      lastP2Word.textContent = state.lastP2 || '——';

      agreeBtn.textContent = '✅ 认为词一样';
      agreeBtn.disabled = true;
    }

    renderHistory();
  }

  function renderHistory() {
    if (!state || !state.history || state.history.length === 0) {
      historyList.innerHTML = '<div class="empty-history">还没有记录，开始第一轮吧 ✨</div>';
      return;
    }

    let html = '';
    state.history.forEach(function (item) {
      html +=
        '<div class="history-item">' +
          '<span class="round-num">第' + item.round + '轮</span>' +
          '<span class="words">' +
            '<span>' + escapeHtml(item.p1) + '</span>' +
            '<span>💞</span>' +
            '<span>' + escapeHtml(item.p2) + '</span>' +
          '</span>' +
        '</div>';
    });
    historyList.innerHTML = html;
  }

  /* =========================================================
   *  十一、结束弹窗逻辑
   * ========================================================= */

  function showResultModal() {
    if (!state || !state.history) return;

    resultRounds.textContent = state.history.length;

    let html = '';
    state.history.forEach(function (item) {
      html +=
        '<div class="result-modal-item">' +
          '<span class="round-tag">第' + item.round + '轮</span>' +
          '<span class="word-pair">' +
            '<span>' + escapeHtml(item.p1) + '</span>' +
            '<span>💞</span>' +
            '<span>' + escapeHtml(item.p2) + '</span>' +
          '</span>' +
        '</div>';
    });
    resultModalList.innerHTML = html;

    resultModal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function hideResultModal() {
    resultModal.classList.add('hidden');
    document.body.style.overflow = '';
  }

  /* =========================================================
   *  十二、生成结果图片
   * ========================================================= */

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // 用省略号截断超长文本
  function drawTextTruncated(ctx, text, x, y, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) {
      ctx.fillText(text, x, y);
      return;
    }
    let truncated = text;
    while (truncated.length > 1 && ctx.measureText(truncated + '…').width > maxWidth) {
      truncated = truncated.slice(0, -1);
    }
    ctx.fillText(truncated + '…', x, y);
  }

  // 生成结果图（返回 canvas）
  function generateResultImage() {
    const rounds = (state && state.history) ? state.history : [];
    const scale = 2;

    // 逻辑尺寸
    const width = 375;
    const cardMargin = 12;
    const cardW = width - cardMargin * 2;
    const cardPadTop = 24;
    const cardPadBottom = 24;

    const titleH = 68;
    const resultH = 72;
    const listPad = 10;
    const itemH = 42;
    const listH = rounds.length * itemH + listPad * 2;
    const footerH = 44;
    const cardH = cardPadTop + titleH + resultH + listH + footerH + cardPadBottom;
    const height = cardH + cardMargin * 2;

    const canvas = document.createElement('canvas');
    canvas.width = width * scale;
    canvas.height = height * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    // 背景渐变
    const bgGrad = ctx.createLinearGradient(0, 0, width, height);
    bgGrad.addColorStop(0, '#fff9e6');
    bgGrad.addColorStop(0.55, '#ffe6f0');
    bgGrad.addColorStop(1, '#e8f5ff');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, width, height);

    // 卡片阴影
    const cardX = cardMargin;
    const cardY = cardMargin;

    ctx.save();
    ctx.shadowColor = 'rgba(255, 150, 180, 0.3)';
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 8;
    roundRect(ctx, cardX, cardY, cardW, cardH, 24);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();

    // 卡片描边
    roundRect(ctx, cardX, cardY, cardW, cardH, 24);
    ctx.strokeStyle = '#fff0f5';
    ctx.lineWidth = 2;
    ctx.stroke();

    let y = cardY + cardPadTop;

    // 主标题
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 20px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#ff6f91';
    ctx.fillText('🌸 同词相遇 🌸', width / 2, y + 16);

    // 副标题
    ctx.font = '12px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#b68b9c';
    ctx.fillText('✨ 心有灵犀一点通 ✨', width / 2, y + 42);

    y += titleH;

    // 成功标题
    ctx.font = 'bold 18px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#ff6f91';
    ctx.fillText('🎉 成功相遇！ 🎉', width / 2, y + 18);

    // 成功副标题
    ctx.font = '13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#c2839a';
    ctx.fillText('经过 ' + rounds.length + ' 轮，你们选择了相同的词', width / 2, y + 48);

    y += resultH;

    // 列表背景
    roundRect(ctx, cardX + 16, y, cardW - 32, listH, 16);
    ctx.fillStyle = '#fff5f8';
    ctx.fill();

    // 列表项
    y += listPad;
    rounds.forEach(function (item) {
      const rowCenterY = y + itemH / 2;
      const centerX = cardX + cardW / 2 + 20;

      // 轮次标签
      ctx.textAlign = 'left';
      ctx.font = 'bold 13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#ff8da1';
      ctx.textBaseline = 'middle';
      ctx.fillText('第' + item.round + '轮', cardX + 34, rowCenterY);

      // 词1（右对齐）
      ctx.textAlign = 'right';
      ctx.font = 'bold 14px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#b3536b';
      drawTextTruncated(ctx, item.p1 || '——', centerX - 20, rowCenterY, 95);

      // 心
      ctx.textAlign = 'center';
      ctx.font = '13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#ff9db0';
      ctx.fillText('💞', centerX, rowCenterY);

      // 词2（左对齐）
      ctx.textAlign = 'left';
      ctx.font = 'bold 14px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#b3536b';
      drawTextTruncated(ctx, item.p2 || '——', centerX + 20, rowCenterY, 95);

      y += itemH;
    });

    y += listPad;

    // 底部信息
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '11px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#c9a3b0';
    const dateStr = new Date().toLocaleDateString('zh-CN');
    ctx.fillText('— 房间 ' + roomId + ' · ' + dateStr + ' —', width / 2, y + 22);

    return canvas;
  }

  // 保存 / 预览图片
  function saveResultImage() {
    if (!state || !state.history || state.history.length === 0) {
      showToast('还没有可保存的记录');
      return;
    }

    const originalText = saveImgBtn.textContent;
    saveImgBtn.textContent = '生成中...';
    saveImgBtn.disabled = true;

    // 让 UI 先显示"生成中"
    setTimeout(function () {
      try {
        const canvas = generateResultImage();
        const dataUrl = canvas.toDataURL('image/png');

        if (isWeixin() || isMobile()) {
          // 微信 / 移动端：显示预览，让用户长按保存
          previewImg.src = dataUrl;
          imgPreviewModal.classList.remove('hidden');
        } else {
          // 桌面端：直接下载
          try {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = '同词相遇_' + roomId + '_' + Date.now() + '.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('💾 图片已保存');
          } catch (e) {
            // 下载失败，降级到预览
            previewImg.src = dataUrl;
            imgPreviewModal.classList.remove('hidden');
          }
        }
      } catch (e) {
        console.error(e);
        showToast('生成图片失败，请重试');
      } finally {
        saveImgBtn.textContent = originalText;
        saveImgBtn.disabled = false;
      }
    }, 60);
  }

  /* =========================================================
   *  十三、返回主页
   * ========================================================= */

  function goHome() {
    clearNextTimer();
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    try {
      if (conn) conn.close();
      if (peer) peer.destroy();
    } catch (e) {}
    conn = null;
    peer = null;
    state = null;
    isHost = false;
    myRole = 'p1';
    retryCount = 0;
    takeoverAttempted = false;
    hostRestoreAttempt = 0;
    resultModalShown = false;

    hideResultModal();
    imgPreviewModal.classList.add('hidden');

    clearSession();
    roomId = '';
    updateURLRoom('');

    wordInput.value = '';
    joinRoomInput.value = '';
    createRoomBtn.disabled = false;
    joinRoomBtn.disabled = false;
    showHomeUI();
    setConnStatus('点击下方按钮创建房间，或输入房间号加入');
    renderHistory();

    showToast('已返回主页');
  }

  /* =========================================================
   *  十四、事件绑定
   * ========================================================= */

  homeBtn.addEventListener('click', function () {
    if (confirm('确定返回主页吗？当前房间的连接将断开。')) {
      goHome();
    }
  });

  createRoomBtn.addEventListener('click', function () {
    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch (e) {}
      peer = null;
    }
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    conn = null;
    state = null;
    clearNextTimer();
    clearSession();
    createRoom();
  });

  joinRoomBtn.addEventListener('click', function () {
    const code = (joinRoomInput.value || '').trim().toUpperCase();
    if (!code || code.length !== 6) {
      showToast('请输入 6 位房间号');
      joinRoomInput.focus();
      return;
    }
    joinRoom(code);
  });

  joinRoomInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      joinRoomBtn.click();
    }
  });

  roomIdDisplay.addEventListener('click', function () {
    if (!roomId) return;
    copyText(roomId, '📋 房间号已复制：' + roomId);
  });

  inviteBtn.addEventListener('click', function () {
    if (!roomId) {
      showToast('房间尚未创建完成');
      return;
    }
    const url = new URL(window.location.href);
    url.searchParams.set('room', roomId);
    url.hash = '';
    copyText(url.toString(), '🔗 邀请链接已复制！发给好友吧');
  });

  submitWordBtn.addEventListener('click', function () {
    if (!state) { showToast('游戏尚未开始'); return; }

    const word = wordInput.value.trim();
    if (!word) {
      showToast('请输入一个词哦～');
      wordInput.focus();
      return;
    }

    const me = state[myRole];
    if (me && me.submitted) {
      showToast('你已经提交过啦');
      return;
    }

    wordInput.value = '';
    sendAction('submit', { word: word });
  });

  wordInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitWordBtn.click();
    }
  });

  agreeBtn.addEventListener('click', function () {
    sendAction('agree');
  });

  restartRoundBtn.addEventListener('click', function () {
    sendAction('restart');
    wordInput.value = '';
    showToast('已全部重来 🌱');
  });

  againBtn.addEventListener('click', function () {
    sendAction('again');
    wordInput.value = '';
    showToast('新的一局开始啦 🌸');
  });

  // 弹窗内：保存图片
  saveImgBtn.addEventListener('click', saveResultImage);

  // 弹窗内：再来一局
  resultAgainBtn.addEventListener('click', function () {
    hideResultModal();
    sendAction('again');
    wordInput.value = '';
    showToast('新的一局开始啦 🌸');
  });

  // 图片预览关闭
  imgPreviewClose.addEventListener('click', function () {
    imgPreviewModal.classList.add('hidden');
    previewImg.src = '';
  });

  /* =========================================================
   *  十五、可见性监听
   * ========================================================= */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;

    if (!peer || peer.destroyed) {
      const savedRoom = localStorage.getItem(LS_ROOM);
      const savedIsHost = localStorage.getItem(LS_IS_HOST);
      const savedRole = localStorage.getItem(LS_MY_ROLE);
      if (savedRoom && savedRole) {
        roomId = savedRoom;
        myRole = savedRole;
        if (savedIsHost === 'true') resumeHost();
        else resumeClient();
      }
      return;
    }

    if (peer.disconnected) {
      try { peer.reconnect(); } catch (e) {}
    }

    if (!conn || !conn.open) {
      if (!isHost) scheduleReconnect();
    }
  });

  /* =========================================================
   *  十六、初始化
   * ========================================================= */
  window.addEventListener('DOMContentLoaded', function () {
    const params = new URLSearchParams(window.location.search);
    const roomFromUrl = params.get('room');
    const savedRoom = localStorage.getItem(LS_ROOM);
    const savedIsHost = localStorage.getItem(LS_IS_HOST);
    const savedRole = localStorage.getItem(LS_MY_ROLE);

    if (roomFromUrl && roomFromUrl.trim()) {
      const room = roomFromUrl.trim().toUpperCase();
      roomId = room;

      if (savedRoom === room && savedRole) {
        myRole = savedRole;
        if (savedIsHost === 'true') resumeHost();
        else resumeClient();
      } else {
        joinRoom(room);
      }
      return;
    }

    if (savedRoom && savedRole) {
      roomId = savedRoom;
      myRole = savedRole;
      if (savedIsHost === 'true') resumeHost();
      else resumeClient();
      return;
    }

    showHomeUI();
    setConnStatus('点击下方按钮创建房间，或输入房间号加入');
  });

  window.addEventListener('beforeunload', function () {
    clearNextTimer();
    if (reconnectTimer) clearTimeout(reconnectTimer);
    try {
      if (conn) conn.close();
      if (peer) peer.destroy();
    } catch (e) {}
  });

})();
</script>
</body>
</html>
