<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>同词相遇 💕 双人默契小游戏</title>
<style>
  /* ===== 全局样式：明亮、圆润、可爱 ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: linear-gradient(145deg, #fff9e6 0%, #ffe6f0 55%, #e8f5ff 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .game-container {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 44px;
    box-shadow: 0 20px 44px rgba(255, 150, 180, 0.28), 0 8px 20px rgba(255, 200, 220, 0.42);
    padding: 26px 20px 28px;
    border: 2px solid #fff0f5;
    animation: popIn 0.5s cubic-bezier(0.3, 1.4, 0.6, 1);
  }

  @keyframes popIn {
    from { transform: scale(0.94); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  h1 {
    font-size: 1.85rem;
    text-align: center;
    color: #ff6f91;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 8px;
    text-shadow: 0 4px 8px #ffe2e9;
  }

  h1 span { font-size: 1.6rem; }

  .subhead {
    text-align: center;
    color: #b68b9c;
    font-size: 0.85rem;
    margin: 0 auto 16px;
    background: #fff0f5;
    display: block;
    padding: 6px 18px;
    border-radius: 30px;
    letter-spacing: 1px;
    width: fit-content;
    border: 1px dashed #ffb6c1;
  }

  /* ===== 连接状态条 ===== */
  .conn-status {
    text-align: center;
    font-size: 0.78rem;
    color: #a78a97;
    background: #fdf2f6;
    border-radius: 30px;
    padding: 7px 14px;
    margin-bottom: 14px;
    border: 1px solid #ffe2ea;
    transition: all 0.3s;
  }
  .conn-status.ok { color: #3a9268; background: #e8f9f0; border-color: #bce9d2; }
  .conn-status.err { color: #c9586f; background: #ffeef2; border-color: #ffc7d4; }

  /* ===== 按钮通用 ===== */
  button {
    border: none;
    cursor: pointer;
    font-weight: 700;
    transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
    -webkit-user-select: none;
    user-select: none;
  }

  button:disabled {
    opacity: 0.45;
    pointer-events: none;
    cursor: not-allowed;
  }

  /* 创建房间按钮 */
  .create-room-btn {
    background: linear-gradient(180deg, #ffb6c1, #ff9db0);
    color: #fff;
    font-size: 1.15rem;
    padding: 17px 20px;
    width: 100%;
    border-radius: 60px;
    box-shadow: 0 8px 0 #d98a9b, 0 12px 20px #ffd3df;
    letter-spacing: 2px;
    text-shadow: 0 1px 3px #d97a90;
  }
  .create-room-btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #d98a9b, 0 6px 12px #ffd3df;
  }

  /* ===== 输入房间号加入 ===== */
  .join-room-area {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .join-room-input {
    flex: 1;
    padding: 15px 18px;
    border-radius: 60px;
    border: 3px solid #ffb7c5;
    background: #fff;
    font-size: 1rem;
    text-align: center;
    outline: none;
    color: #5e3e4a;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    transition: border-color 0.2s, box-shadow 0.2s;
    min-width: 0;
  }
  .join-room-input:focus {
    border-color: #ff6f91;
    box-shadow: 0 0 0 6px #ffe2e9;
  }
  .join-room-input::placeholder {
    color: #dcbcc6;
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
  }
  .join-room-btn {
    background: linear-gradient(180deg, #b0e9ca, #8fdcb5);
    color: #1f6446;
    font-size: 1rem;
    padding: 15px 22px;
    border-radius: 60px;
    box-shadow: 0 6px 0 #79c6a0;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .join-room-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #79c6a0;
  }

  /* ===== 房间区域 ===== */
  .room-area {
    background: #fff6f9;
    border-radius: 30px;
    padding: 14px 16px;
    margin-bottom: 16px;
    border: 2px solid #ffdae0;
    animation: popIn 0.35s ease;
  }

  .room-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .room-badge {
    background: linear-gradient(180deg, #ffb6c1, #ff9db0);
    color: #fff;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 40px;
    font-size: 0.95rem;
    letter-spacing: 1px;
    box-shadow: 0 4px 0 #e09aa9;
    word-break: break-all;
    text-shadow: 0 1px 2px #d97a90;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }
  .room-badge:active {
    transform: scale(0.96) translateY(2px);
    box-shadow: 0 2px 0 #e09aa9;
  }

  .invite-btn {
    background: linear-gradient(180deg, #ffe066, #ffd23f);
    color: #8a6220;
    padding: 9px 18px;
    font-size: 0.9rem;
    border-radius: 40px;
    box-shadow: 0 5px 0 #e0b93c;
  }
  .invite-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #e0b93c;
  }

  .room-hint {
    font-size: 0.75rem;
    color: #c9a3b0;
    margin-top: 9px;
    text-align: center;
  }

  /* ===== 游戏区域 ===== */
  .word-section {
    background: #fffafc;
    border-radius: 32px;
    padding: 18px 14px;
    margin-bottom: 14px;
    border: 3px solid #ffe1e8;
    box-shadow: inset 0 0 0 4px #fff;
  }

  .turn-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .round-badge {
    background: #ffcad4;
    padding: 5px 14px;
    border-radius: 30px;
    color: #a34e62;
    font-weight: 700;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  #playerStatus {
    font-size: 0.82rem;
    color: #c2839a;
    font-weight: 600;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .word-input {
    width: 100%;
    padding: 16px 20px;
    border-radius: 60px;
    border: 3px solid #ffb7c5;
    background: #fff;
    font-size: 1.15rem;
    text-align: center;
    outline: none;
    color: #5e3e4a;
    font-weight: 600;
    letter-spacing: 1px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .word-input:focus {
    border-color: #ff6f91;
    box-shadow: 0 0 0 6px #ffe2e9;
  }
  .word-input:disabled {
    background: #fdf3f6;
    color: #bda3ae;
    border-color: #ffdde4;
  }
  .word-input::placeholder {
    color: #dcbcc6;
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0;
  }
  /* 对方已提交时，输入框轻微脉冲提醒 */
  .word-input.other-submitted {
    animation: pulseBorder 1.6s ease infinite;
  }
  @keyframes pulseBorder {
    0%, 100% { box-shadow: 0 0 0 6px rgba(255, 226, 233, 0.9); }
    50%      { box-shadow: 0 0 0 12px rgba(255, 208, 221, 0.55); }
  }

  .submit-btn {
    background: linear-gradient(180deg, #8bd3dd, #6dc4d0);
    color: #15505a;
    font-size: 1.05rem;
    padding: 15px;
    border-radius: 60px;
    box-shadow: 0 6px 0 #579aa6, 0 8px 14px #cdeff3;
    letter-spacing: 1px;
  }
  .submit-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #579aa6, 0 4px 8px #cdeff3;
  }

  /* 上一轮展示 */
  .last-round-box {
    background: #fff2f6;
    border-radius: 26px;
    padding: 13px 15px;
    margin-top: 16px;
    border-left: 7px solid #ffb7c5;
  }

  .last-round-title {
    font-weight: 700;
    color: #ff6f91;
    font-size: 0.88rem;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 9px;
  }

  .last-round-words {
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 6px;
    font-weight: 700;
  }

  .last-round-words span {
    background: #fff;
    padding: 7px 14px;
    border-radius: 40px;
    box-shadow: 0 2px 6px #ffd9e2;
    color: #b3536b;
    min-width: 70px;
    text-align: center;
    font-size: 0.95rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 130px;
  }

  /* ===== 操作按钮 ===== */
  .action-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .agree-btn {
    background: linear-gradient(180deg, #b0e9ca, #8fdcb5);
    color: #1f6446;
    padding: 15px 12px;
    flex: 1;
    font-size: 0.92rem;
    border-radius: 40px;
    box-shadow: 0 6px 0 #79c6a0;
    letter-spacing: 0.5px;
  }
  .agree-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #79c6a0;
  }

  .restart-btn {
    background: linear-gradient(180deg, #ffd966, #ffcc33);
    color: #7d5614;
    padding: 15px 12px;
    flex: 1;
    font-size: 0.92rem;
    border-radius: 40px;
    box-shadow: 0 6px 0 #dcb03a;
    letter-spacing: 0.5px;
  }
  .restart-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #dcb03a;
  }

  /* ===== 历史面板 ===== */
  .history-panel {
    background: #fff5f8;
    border-radius: 30px;
    padding: 18px 14px;
    border: 2px solid #ffd9e2;
  }

  .history-title {
    font-size: 1.05rem;
    color: #ff6f91;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
    font-weight: 700;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 240px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .history-list::-webkit-scrollbar { width: 5px; }
  .history-list::-webkit-scrollbar-thumb {
    background: #ffc7d4; border-radius: 10px;
  }

  .history-item {
    background: #fff;
    padding: 10px 14px;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    color: #694e58;
    box-shadow: 0 3px 6px #ffe2ea;
    border: 1px solid #ffe2ea;
    font-size: 0.88rem;
    animation: popIn 0.3s ease;
  }

  .history-item .round-num {
    color: #ff8da1;
    font-weight: 700;
    font-size: 0.8rem;
    white-space: nowrap;
    margin-right: 8px;
  }

  .history-item .words {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .history-item .words span {
    background: #fef0f4;
    padding: 3px 11px;
    border-radius: 30px;
    color: #b3536b;
    font-weight: 700;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty-history {
    text-align: center;
    color: #dcb9c4;
    padding: 14px 8px;
    font-size: 0.85rem;
  }

  /* 成功信息 */
  .success-message {
    text-align: center;
    font-size: 1.35rem;
    color: #ff6f91;
    font-weight: 800;
    margin: 14px 0 6px;
    line-height: 1.5;
    text-shadow: 0 4px 8px #ffd3df;
    animation: popIn 0.45s cubic-bezier(0.3, 1.5, 0.6, 1);
  }
  .success-message small {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #c2839a;
    margin-top: 6px;
    text-shadow: none;
  }

  /* 再来一把 */
  .again-btn {
    background: linear-gradient(180deg, #ffb6c1, #ff9db0);
    color: #fff;
    font-size: 1.15rem;
    padding: 16px;
    width: 100%;
    border-radius: 60px;
    box-shadow: 0 8px 0 #d98a9b, 0 10px 18px #ffd3df;
    margin-top: 14px;
    letter-spacing: 2px;
    text-shadow: 0 1px 3px #d97a90;
  }
  .again-btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #d98a9b;
  }

  /* ===== 工具类 ===== */
  .hidden { display: none !important; }

  /* 浮动提示 */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: #ff9db0;
    color: #fff;
    font-weight: 700;
    font-size: 0.92rem;
    padding: 12px 26px;
    border-radius: 40px;
    box-shadow: 0 10px 24px rgba(255, 130, 160, 0.5);
    transition: opacity 0.3s, transform 0.3s;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="game-container">
  <!-- 标题 -->
  <h1><span>🌸</span> 同词相遇 <span>🌸</span></h1>
  <div class="subhead">✨ 心有灵犀一点通 ✨</div>

  <!-- 连接状态 -->
  <div class="conn-status" id="connStatus">未连接</div>

  <!-- 创建房间按钮（初始显示） -->
  <button class="create-room-btn" id="createRoomBtn">🏠 创建房间</button>

  <!-- 输入房间号加入（初始显示） -->
  <div class="join-room-area" id="joinRoomArea">
    <input type="text" class="join-room-input" id="joinRoomInput"
           placeholder="输入房间号加入" maxlength="6" autocomplete="off">
    <button class="join-room-btn" id="joinRoomBtn">加入</button>
  </div>

  <!-- 房间信息区（创建/加入后显示） -->
  <div id="roomArea" class="room-area hidden">
    <div class="room-info">
      <div class="room-badge" id="roomIdDisplay" title="点击复制房间号">房间: ---</div>
      <button class="invite-btn" id="inviteBtn">📋 邀请好友</button>
    </div>
    <div class="room-hint">点击房间号可复制，点击邀请可复制带房间号的链接</div>
  </div>

  <!-- 游戏主区域 -->
  <div id="gamePlayArea" class="hidden">
    <!-- 输入区 -->
    <div class="word-section">
      <div class="turn-indicator">
        <span class="round-badge" id="roundCounter">第 1 轮</span>
        <span id="playerStatus">准备中...</span>
      </div>

      <div class="input-group">
        <input type="text" class="word-input" id="wordInput"
               placeholder="输入你想的词..." maxlength="20" autocomplete="off">
        <button class="submit-btn" id="submitWordBtn">提交 ✨</button>
      </div>

      <!-- 上一轮 / 本轮结果 -->
      <div class="last-round-box">
        <div class="last-round-title">
          <span>🕊️</span> <span id="lastRoundTitle">上一轮输入</span>
        </div>
        <div class="last-round-words">
          <span id="lastP1Word">——</span>
          <span>💞</span>
          <span id="lastP2Word">——</span>
        </div>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-buttons">
      <button class="agree-btn" id="agreeBtn" disabled>✅ 认为词一样</button>
      <button class="restart-btn" id="restartRoundBtn">🔄 全部重来</button>
    </div>

    <!-- 历史记录 / 结束界面 -->
    <div class="history-panel">
      <div class="history-title"><span>📜</span> 相遇轨迹 <span>📜</span></div>
      <div class="history-list" id="historyList">
        <div class="empty-history">还没有记录，开始第一轮吧 ✨</div>
      </div>
      <div id="successMessage" class="success-message hidden"></div>
      <button id="againBtn" class="again-btn hidden">🌸 再来一把</button>
    </div>
  </div>

  <!-- 浮动提示 -->
  <div class="toast" id="toast"></div>
</div>

<!-- PeerJS：免费公共信令服务器，用于 WebRTC 建立点对点连接 -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  一、全局状态
   * ========================================================= */
  let peer = null;              // PeerJS 实例
  let conn = null;              // 数据连接
  let isHost = false;           // 是否是房主
  let myRole = 'p1';            // 自己的角色：p1 或 p2
  let roomId = '';              // 当前房间号
  let state = null;             // 游戏状态（房主权威，客户端镜像）
  let retryCount = 0;           // 客户端连接重试次数
  let nextRoundTimer = null;    // 词不同时自动下一轮的定时器（仅房主端）
  let reconnectTimer = null;    // 客户端断线重连定时器
  let hostRestoreAttempt = 0;   // 房主恢复房间号的重试次数

  // localStorage 会话键名
  const LS_ROLE = 'tongci_role';    // 'host' | 'client'
  const LS_ROOM = 'tongci_room';    // 房间号
  const LS_STATE = 'tongci_state_'; // 房主状态快照前缀

  /* =========================================================
   *  二、DOM 引用
   * ========================================================= */
  const $ = (id) => document.getElementById(id);

  const createRoomBtn   = $('createRoomBtn');
  const joinRoomArea    = $('joinRoomArea');
  const joinRoomInput   = $('joinRoomInput');
  const joinRoomBtn     = $('joinRoomBtn');
  const roomArea        = $('roomArea');
  const roomIdDisplay   = $('roomIdDisplay');
  const inviteBtn       = $('inviteBtn');
  const gamePlayArea    = $('gamePlayArea');
  const connStatus      = $('connStatus');
  const roundCounter    = $('roundCounter');
  const playerStatus    = $('playerStatus');
  const wordInput       = $('wordInput');
  const submitWordBtn   = $('submitWordBtn');
  const lastRoundTitle  = $('lastRoundTitle');
  const lastP1Word      = $('lastP1Word');
  const lastP2Word      = $('lastP2Word');
  const agreeBtn        = $('agreeBtn');
  const restartRoundBtn = $('restartRoundBtn');
  const historyList     = $('historyList');
  const successMessage  = $('successMessage');
  const againBtn        = $('againBtn');
  const toast           = $('toast');

  /* =========================================================
   *  三、工具函数
   * ========================================================= */

  let toastTimer = null;
  function showToast(msg, duration = 2200) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
  }

  function setConnStatus(text, type) {
    connStatus.textContent = text;
    connStatus.classList.remove('ok', 'err');
    if (type === 'ok') connStatus.classList.add('ok');
    if (type === 'err') connStatus.classList.add('err');
  }

  function genRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function escapeHtml(str) {
    if (!str) return '——';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 通用复制（含降级方案）
  function copyText(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () { showToast(successMsg || '已复制'); })
        .catch(function () { fallbackCopy(text, successMsg); });
    } else {
      fallbackCopy(text, successMsg);
    }
  }

  function fallbackCopy(text, successMsg) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast(successMsg || '已复制');
    } catch (e) {
      window.prompt('请手动复制下面的内容：', text);
    }
    document.body.removeChild(ta);
  }

  /* =========================================================
   *  四、会话持久化
   * ========================================================= */

  function saveSession() {
    try {
      if (roomId) {
        localStorage.setItem(LS_ROOM, roomId);
        localStorage.setItem(LS_ROLE, isHost ? 'host' : 'client');
      }
    } catch (e) { /* 隐私模式可能报错，忽略 */ }
  }

  function saveStateSnapshot() {
    if (isHost && state && roomId) {
      try {
        localStorage.setItem(LS_STATE + roomId, JSON.stringify(state));
      } catch (e) {}
    }
  }

  function loadStateSnapshot() {
    if (!roomId) return null;
    try {
      const s = localStorage.getItem(LS_STATE + roomId);
      if (s) return JSON.parse(s);
    } catch (e) {}
    return null;
  }

  function clearSession() {
    try {
      localStorage.removeItem(LS_ROLE);
      localStorage.removeItem(LS_ROOM);
      if (roomId) localStorage.removeItem(LS_STATE + roomId);
    } catch (e) {}
  }

  /* =========================================================
   *  五、游戏状态与房主权威逻辑
   * ========================================================= */

  function initialState() {
    return {
      round: 1,
      p1: { word: '', submitted: false, agreed: false },
      p2: { word: '', submitted: false, agreed: false },
      lastP1: '',
      lastP2: '',
      history: [],
      gameOver: false,
      pendingNextRound: false
    };
  }

  function clearNextTimer() {
    if (nextRoundTimer) {
      clearTimeout(nextRoundTimer);
      nextRoundTimer = null;
    }
  }

  // 把本轮词写入历史（防重复）
  function pushHistoryIfNeeded() {
    if (!state) return;
    if (state.history.some(h => h.round === state.round)) return;
    state.history.push({
      round: state.round,
      p1: state.p1.word,
      p2: state.p2.word
    });
  }

  // 本轮成功：记录历史，结束游戏
  function finishRound() {
    clearNextTimer();
    pushHistoryIfNeeded();
    state.lastP1 = state.p1.word;
    state.lastP2 = state.p2.word;
    state.gameOver = true;
    state.pendingNextRound = false;
  }

  // 进入下一轮：记录上一轮，重置双方提交状态
  function goNextRound() {
    clearNextTimer();
    pushHistoryIfNeeded();
    state.lastP1 = state.p1.word;
    state.lastP2 = state.p2.word;
    state.round += 1;
    state.p1 = { word: '', submitted: false, agreed: false };
    state.p2 = { word: '', submitted: false, agreed: false };
    state.pendingNextRound = false;
  }

  // 双方都已提交后的判定
  function afterSubmit() {
    if (!state.p1.submitted || !state.p2.submitted) return;

    if (state.p1.word === state.p2.word) {
      // 词相同 → 自动成功结束
      finishRound();
    } else {
      // 词不同 → 标记等待，2 秒后自动进入下一轮
      // 期间双方都可点"认为词一样"，双方都认同则提前结束
      state.pendingNextRound = true;
      clearNextTimer();
      nextRoundTimer = setTimeout(() => {
        nextRoundTimer = null;
        if (!state || state.gameOver) return;
        goNextRound();
        broadcastState();
        render();
      }, 2000);
    }
  }

  // 处理一个动作（role: 'p1' | 'p2'）
  function handleAction(role, action, data) {
    if (!isHost) return;
    if (!state) state = initialState();

    const isP1 = role === 'p1';
    const mySlot = isP1 ? state.p1 : state.p2;

    if (action === 'submit') {
      if (state.gameOver || state.pendingNextRound) return;
      if (mySlot.submitted) return;
      const word = ((data && data.word) || '').trim().slice(0, 20);
      if (!word) return;
      mySlot.word = word;
      mySlot.submitted = true;
      afterSubmit();

    } else if (action === 'agree') {
      // 认为词一样：只有等待下一轮期间可用，且需双方都认同
      if (state.gameOver || !state.pendingNextRound) return;
      if (mySlot.agreed) return;
      mySlot.agreed = true;
      if (state.p1.agreed && state.p2.agreed) {
        finishRound();
      }

    } else if (action === 'restart' || action === 'again') {
      clearNextTimer();
      state = initialState();
    }

    broadcastState();
    render();
  }

  // 房主广播状态给客户端 + 持久化
  function broadcastState() {
    if (!isHost) return;
    saveStateSnapshot();
    if (conn && conn.open && state) {
      try {
        conn.send({ type: 'state', state: state });
      } catch (e) { /* 忽略 */ }
    }
  }

  // 发起动作（房主本地执行，客户端发给房主）
  function sendAction(action, data) {
    if (isHost) {
      handleAction(myRole, action, data);
    } else {
      if (conn && conn.open) {
        try {
          conn.send({ type: 'action', action: action, data: data || {} });
        } catch (e) {
          showToast('发送失败，正在重连...');
          scheduleReconnect();
        }
      } else {
        showToast('连接尚未就绪，正在重连...');
        scheduleReconnect();
      }
    }
  }

  /* =========================================================
   *  六、PeerJS 连接管理
   * ========================================================= */

  // 创建房间（首次创建）
  function createRoom() {
    isHost = true;
    myRole = 'p1';
    roomId = genRoomCode();
    hostRestoreAttempt = 0;

    setConnStatus('正在创建房间...');
    createRoomBtn.disabled = true;

    peer = new Peer('tongci-' + roomId, { debug: 0 });

    peer.on('open', () => {
      state = initialState();
      saveSession();
      saveStateSnapshot();

      // 更新 URL，方便刷新后仍能识别为房主
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('room', roomId);
        window.history.replaceState(null, '', url.toString());
      } catch (e) {}

      showRoomUI();
      render();
      setConnStatus('房间已创建，等待好友加入...', 'ok');
      showToast('房间创建成功！点击「邀请好友」或分享房间号');
    });

    peer.on('connection', (connection) => {
      if (conn && conn.open) {
        try { connection.close(); } catch (e) {}
        return;
      }
      conn = connection;
      setupConnection();
    });

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed) {
        try { peer.reconnect(); } catch (e) {}
      }
    });

    peer.on('error', handlePeerError);
  }

  // 加入房间（手动输入房间号 / 从链接加入）
  function joinRoom(code) {
    isHost = false;
    myRole = 'p2';
    roomId = code.toUpperCase();
    retryCount = 0;

    saveSession();

    // 更新 URL，方便刷新
    try {
      const url = new URL(window.location.href);
      url.searchParams.set('room', roomId);
      window.history.replaceState(null, '', url.toString());
    } catch (e) {}

    setConnStatus('正在连接房间 ' + roomId + ' ...');
    createRoomBtn.disabled = true;
    joinRoomBtn.disabled = true;

    peer = new Peer(null, { debug: 0 });

    peer.on('open', () => {
      showRoomUI();
      connectToHost();
    });

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed) {
        try { peer.reconnect(); } catch (e) {}
      }
    });

    peer.on('error', handlePeerError);
  }

  // 客户端连接房主
  function connectToHost() {
    if (!peer || peer.destroyed) return;
    if (conn && conn.open) return;

    // 清理旧连接
    if (conn) {
      try { conn.close(); } catch (e) {}
      conn = null;
    }

    try {
      conn = peer.connect('tongci-' + roomId, { reliable: true });
      setupConnection();
    } catch (e) {
      console.error(e);
    }
  }

  // 建立连接后的通用事件绑定
  function setupConnection() {
    if (!conn) return;

    conn.on('open', () => {
      setConnStatus('已连接 ✅', 'ok');
      retryCount = 0;

      if (isHost) {
        // 房主把当前状态同步给新加入/重连的玩家
        broadcastState();
      } else {
        // 客户端连上后请求一次最新状态，保证恢复时不会看到旧数据
        try { conn.send({ type: 'hello' }); } catch (e) {}
      }
      render();
    });

    conn.on('data', (data) => {
      if (!data || typeof data !== 'object') return;

      if (isHost) {
        if (data.type === 'action') {
          handleAction('p2', data.action, data.data);
        } else if (data.type === 'hello') {
          // 客户端重连后请求状态
          broadcastState();
        }
      } else {
        if (data.type === 'state' && data.state) {
          state = data.state;
          render();
        }
      }
    });

    conn.on('close', () => {
      conn = null;
      if (isHost) {
        // 房主保持 Peer 在线，等待客户端重连
        setConnStatus('好友已断开，等待重连...', 'err');
      } else {
        setConnStatus('连接断开，正在重连...', 'err');
        scheduleReconnect();
      }
      render();
    });

    conn.on('error', (err) => {
      console.error('[Conn Error]', err);
    });
  }

  // 客户端断线重连调度（防抖）
  function scheduleReconnect() {
    if (isHost) return;
    if (reconnectTimer) return;

    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      if (!conn || !conn.open) {
        setConnStatus('正在重连房间...');
        connectToHost();
      }
    }, 2500);
  }

  // PeerJS 错误统一处理
  function handlePeerError(err) {
    console.error('[PeerJS Error]', err);

    if (err.type === 'peer-unavailable') {
      // 客户端：房主暂时不在线，持续重试
      if (!isHost) {
        if (retryCount < 30) {
          retryCount++;
          setConnStatus('等待房主上线... (' + retryCount + '/30)');
          setTimeout(() => {
            if (!conn || !conn.open) connectToHost();
          }, 3000);
        } else {
          setConnStatus('无法连接，请稍后刷新重试', 'err');
          showToast('找不到该房间，请确认房间号后重试');
        }
      }
    } else if (err.type === 'unavailable-id') {
      // 房主端房间号被占用（旧连接未释放），交给恢复逻辑处理
      if (!isHost) {
        setConnStatus('网络异常，请刷新重试', 'err');
      }
    } else if (err.type === 'network' || err.type === 'server-error') {
      setConnStatus('网络错误，正在重试...', 'err');
      if (!isHost) {
        setTimeout(() => {
          if (!conn || !conn.open) connectToHost();
        }, 3000);
      } else if (peer && peer.disconnected) {
        try { peer.reconnect(); } catch (e) {}
      }
    } else {
      setConnStatus('连接异常: ' + err.type, 'err');
    }
  }

  /* =========================================================
   *  七、会话恢复（刷新 / 切回前台）
   * ========================================================= */

  // 房主恢复：用相同 Peer ID 重新注册，等待好友重连
  function resumeHost() {
    isHost = true;
    myRole = 'p1';
    hostRestoreAttempt = 0;

    // 恢复房主端状态快照
    const snapshot = loadStateSnapshot();
    if (snapshot) {
      state = snapshot;
      // 如果之前在等待自动下一轮，重启定时器
      if (state.pendingNextRound && !state.gameOver) {
        // 清掉旧定时器（刷新前已丢失），重新起一个
        clearNextTimer();
        nextRoundTimer = setTimeout(() => {
          nextRoundTimer = null;
          if (!state || state.gameOver) return;
          goNextRound();
          broadcastState();
          render();
        }, 2000);
      }
    } else {
      state = initialState();
    }

    showRoomUI();
    render();
    setConnStatus('正在恢复房间...');

    setTimeout(() => createHostPeerWithRetry(), 600);
  }

  function createHostPeerWithRetry() {
    if (hostRestoreAttempt > 8) {
      setConnStatus('恢复失败，请刷新重试', 'err');
      return;
    }
    hostRestoreAttempt++;

    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch (e) {}
    }

    peer = new Peer('tongci-' + roomId, { debug: 0 });

    peer.on('open', () => {
      setConnStatus('房间已恢复，等待好友加入...', 'ok');
      showToast('房间已恢复');
      hostRestoreAttempt = 0;
    });

    peer.on('connection', (connection) => {
      if (conn && conn.open) {
        try { connection.close(); } catch (e) {}
        return;
      }
      conn = connection;
      setupConnection();
    });

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed) {
        try { peer.reconnect(); } catch (e) {}
      }
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        // 旧 ID 还没释放，2 秒后重试
        setConnStatus('房间恢复中，请稍候...');
        setTimeout(() => createHostPeerWithRetry(), 2000);
      } else {
        handlePeerError(err);
      }
    });
  }

  // 客户端恢复：新建 Peer，主动去连房主
  function resumeClient() {
    isHost = false;
    myRole = 'p2';
    retryCount = 0;

    showRoomUI();
    setConnStatus('正在重连房间 ' + roomId + ' ...');
    render();

    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch (e) {}
    }

    peer = new Peer(null, { debug: 0 });

    peer.on('open', () => {
      connectToHost();
    });

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed) {
        try { peer.reconnect(); } catch (e) {}
      }
    });

    peer.on('error', handlePeerError);
  }

  /* =========================================================
   *  八、界面切换与渲染
   * ========================================================= */

  function showRoomUI() {
    createRoomBtn.classList.add('hidden');
    joinRoomArea.classList.add('hidden');
    roomArea.classList.remove('hidden');
    gamePlayArea.classList.remove('hidden');
    roomIdDisplay.textContent = (isHost ? '🏠 房间: ' : '👤 房间: ') + roomId;
  }

  function render() {
    if (!state) {
      // 客户端刚恢复时可能还没有拿到状态，显示等待提示
      wordInput.disabled = true;
      submitWordBtn.disabled = true;
      roundCounter.textContent = '第 — 轮';
      playerStatus.textContent = '正在同步游戏状态...';
      lastP1Word.textContent = '——';
      lastP2Word.textContent = '——';
      return;
    }

    const me = (myRole === 'p1') ? state.p1 : state.p2;
    const other = (myRole === 'p1') ? state.p2 : state.p1;

    roundCounter.textContent = '第 ' + state.round + ' 轮';

    /* ---------- 游戏已结束 ---------- */
    if (state.gameOver) {
      wordInput.disabled = true;
      submitWordBtn.disabled = true;
      wordInput.classList.remove('other-submitted');
      agreeBtn.classList.add('hidden');
      restartRoundBtn.classList.add('hidden');
      againBtn.classList.remove('hidden');

      const rounds = state.history.length;
      successMessage.classList.remove('hidden');
      successMessage.innerHTML =
        '🎉 成功相遇！ 🎉' +
        '<small>经过 ' + rounds + ' 轮，你们选择了相同的词</small>';

      playerStatus.textContent = '游戏结束 🎊';
      lastRoundTitle.textContent = '最终选择';
      lastP1Word.textContent = state.lastP1 || '——';
      lastP2Word.textContent = state.lastP2 || '——';

      renderHistory();
      return;
    }

    /* ---------- 游戏进行中 ---------- */
    successMessage.classList.add('hidden');
    againBtn.classList.add('hidden');
    agreeBtn.classList.remove('hidden');
    restartRoundBtn.classList.remove('hidden');
    restartRoundBtn.textContent = '🔄 全部重来';

    if (state.pendingNextRound) {
      // 双方已提交但词不同，等待自动进入下一轮
      wordInput.disabled = true;
      submitWordBtn.disabled = true;
      wordInput.classList.remove('other-submitted');

      lastRoundTitle.textContent = '本轮输入';
      lastP1Word.textContent = state.p1.word || '——';
      lastP2Word.textContent = state.p2.word || '——';

      playerStatus.textContent = '词语不同，即将进入下一轮...';

      if (me.agreed) {
        agreeBtn.textContent = '✔ 已认同，等待对方';
        agreeBtn.disabled = true;
      } else {
        agreeBtn.textContent = '✅ 认为词一样';
        agreeBtn.disabled = false;
      }

    } else {
      // 正常提交阶段（双方都提交前都可输入）
      if (me.submitted) {
        wordInput.disabled = true;
        submitWordBtn.disabled = true;
        wordInput.classList.remove('other-submitted');
        playerStatus.textContent = '✅ 你已提交，等待对方...';
      } else {
        wordInput.disabled = false;
        submitWordBtn.disabled = false;

        if (other.submitted) {
          // 对方已提交，我方还没提交 → 强化提示 + 输入框脉冲
          playerStatus.textContent = '⏳ 对方已提交，等你啦！';
          wordInput.classList.add('other-submitted');
        } else {
          playerStatus.textContent = '轮到你了，输入一个词吧';
          wordInput.classList.remove('other-submitted');
        }
      }

      lastRoundTitle.textContent = '上一轮输入';
      lastP1Word.textContent = state.lastP1 || '——';
      lastP2Word.textContent = state.lastP2 || '——';

      agreeBtn.textContent = '✅ 认为词一样';
      agreeBtn.disabled = true;
    }

    renderHistory();
  }

  function renderHistory() {
    if (!state || !state.history || state.history.length === 0) {
      historyList.innerHTML = '<div class="empty-history">还没有记录，开始第一轮吧 ✨</div>';
      return;
    }

    let html = '';
    state.history.forEach(function (item) {
      html +=
        '<div class="history-item">' +
          '<span class="round-num">第' + item.round + '轮</span>' +
          '<span class="words">' +
            '<span>' + escapeHtml(item.p1) + '</span>' +
            '<span>💞</span>' +
            '<span>' + escapeHtml(item.p2) + '</span>' +
          '</span>' +
        '</div>';
    });
    historyList.innerHTML = html;
  }

  /* =========================================================
   *  九、事件绑定
   * ========================================================= */

  // 创建房间
  createRoomBtn.addEventListener('click', function () {
    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch (e) {}
      peer = null;
    }
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    conn = null;
    state = null;
    clearNextTimer();
    clearSession();
    createRoom();
  });

  // 手动输入房间号加入
  joinRoomBtn.addEventListener('click', function () {
    const code = (joinRoomInput.value || '').trim().toUpperCase();
    if (!code || code.length !== 6) {
      showToast('请输入 6 位房间号');
      joinRoomInput.focus();
      return;
    }
    joinRoom(code);
  });

  // 房间号输入框回车
  joinRoomInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      joinRoomBtn.click();
    }
  });

  // 点击房间号复制
  roomIdDisplay.addEventListener('click', function () {
    if (!roomId) return;
    copyText(roomId, '📋 房间号已复制：' + roomId);
  });

  // 邀请好友（复制带房间号的链接）
  inviteBtn.addEventListener('click', function () {
    if (!roomId) {
      showToast('房间尚未创建完成');
      return;
    }

    const url = new URL(window.location.href);
    url.searchParams.set('room', roomId);
    url.hash = '';
    const link = url.toString();

    copyText(link, '🔗 邀请链接已复制！发给好友吧');
  });

  // 提交词语
  submitWordBtn.addEventListener('click', function () {
    if (!state) { showToast('游戏尚未开始'); return; }

    const word = wordInput.value.trim();
    if (!word) {
      showToast('请输入一个词哦～');
      wordInput.focus();
      return;
    }

    const me = (myRole === 'p1') ? state.p1 : state.p2;
    if (me.submitted) {
      showToast('你已经提交过啦');
      return;
    }

    wordInput.value = '';
    sendAction('submit', { word: word });
  });

  // 输入框回车提交
  wordInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitWordBtn.click();
    }
  });

  // 认为词一样（需双方都认同才结束）
  agreeBtn.addEventListener('click', function () {
    sendAction('agree');
  });

  // 全部重来（重置所有内容）
  restartRoundBtn.addEventListener('click', function () {
    sendAction('restart');
    wordInput.value = '';
    showToast('已全部重来 🌱');
  });

  // 再来一把（结束后重置）
  againBtn.addEventListener('click', function () {
    sendAction('again');
    wordInput.value = '';
    showToast('新的一局开始啦 🌸');
  });

  /* =========================================================
   *  十、页面可见性监听（切回前台自动修复连接）
   * ========================================================= */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;

    // 1) Peer 实例已被回收（页面被完全刷新/回收），走完整会话恢复
    if (!peer || peer.destroyed) {
      const savedRoom = localStorage.getItem(LS_ROOM);
      const savedRole = localStorage.getItem(LS_ROLE);
      if (savedRoom && savedRole) {
        roomId = savedRoom;
        if (savedRole === 'host') {
          resumeHost();
        } else {
          resumeClient();
        }
      }
      return;
    }

    // 2) 信令层断线，重连
    if (peer.disconnected) {
      try { peer.reconnect(); } catch (e) {}
    }

    // 3) 数据通道异常
    if (!conn || !conn.open) {
      if (!isHost) {
        scheduleReconnect();
      }
    }
  });

  /* =========================================================
   *  十一、页面初始化
   * ========================================================= */
  window.addEventListener('DOMContentLoaded', function () {
    const params = new URLSearchParams(window.location.search);
    const roomFromUrl = params.get('room');
    const savedRoom = localStorage.getItem(LS_ROOM);
    const savedRole = localStorage.getItem(LS_ROLE);

    // 1) URL 带房间号
    if (roomFromUrl && roomFromUrl.trim()) {
      const room = roomFromUrl.trim().toUpperCase();
      roomId = room;

      if (savedRole === 'host' && savedRoom === room) {
        // 同一个人刷新，恢复房主
        resumeHost();
      } else if (savedRole === 'client' && savedRoom === room) {
        // 同一个客户端刷新，恢复连接
        resumeClient();
      } else {
        // 首次通过链接加入
        joinRoom(room);
      }
      return;
    }

    // 2) 本地有会话记录（刷新/切后台恢复）
    if (savedRoom && savedRole) {
      roomId = savedRoom;
      if (savedRole === 'host') {
        resumeHost();
      } else {
        resumeClient();
      }
      return;
    }

    // 3) 全新用户
    setConnStatus('点击下方按钮创建房间，或输入房间号加入');
    render();
  });

  window.addEventListener('beforeunload', function () {
    clearNextTimer();
    if (reconnectTimer) clearTimeout(reconnectTimer);
    try {
      if (conn) conn.close();
      if (peer) peer.destroy();
    } catch (e) {}
  });

})();
</script>
</body>
</html>
