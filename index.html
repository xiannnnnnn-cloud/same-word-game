<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>同词相遇 💕 双人默契小游戏</title>
  <style>
    /* 全局样式：明亮、圆润、可爱 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #fff9e6 0%, #ffe6f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .game-container {
      width: 100%;
      max-width: 500px;
      background: #ffffffd6;
      backdrop-filter: blur(8px);
      border-radius: 48px;
      box-shadow: 0 20px 40px rgba(255, 150, 180, 0.25), 0 8px 20px rgba(255, 200, 220, 0.4);
      padding: 28px 22px 32px;
      border: 2px solid #fff0f5;
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 2rem;
      text-align: center;
      color: #ff6f91;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
      text-shadow: 0 4px 8px #ffe2e9;
    }

    h1 span {
      font-size: 2rem;
    }

    .subhead {
      text-align: center;
      color: #b68b9c;
      font-size: 0.9rem;
      margin-bottom: 24px;
      background: #fff0f5;
      display: inline-block;
      padding: 6px 18px;
      border-radius: 30px;
      letter-spacing: 1px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      border: 1px dashed #ffb6c1;
    }

    /* 房间区域 */
    .room-area {
      background: #fff6f9;
      border-radius: 32px;
      padding: 16px 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #ffdae0;
    }

    .room-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .room-badge {
      background: #ffb6c1;
      color: #ffffff;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 1rem;
      box-shadow: 0 6px 0 #e09aa9;
      letter-spacing: 0.5px;
      word-break: break-all;
    }

    .invite-btn, .restart-btn, .submit-btn, .agree-btn {
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
      border-radius: 60px;
      box-shadow: 0 6px 0 #d9a7b4;
      transform: translateY(0);
    }

    .invite-btn:active, .restart-btn:active, .submit-btn:active, .agree-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d9a7b4;
    }

    .invite-btn {
      background: #ffe066;
      color: #9b6b3e;
      padding: 10px 20px;
      font-size: 0.95rem;
      box-shadow: 0 6px 0 #e6c34d;
      border: 2px solid #fff3c9;
    }

    .invite-btn:active {
      box-shadow: 0 2px 0 #e6c34d;
    }

    .create-room-btn {
      background: #ffb6c1;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 18px 20px;
      width: 100%;
      border-radius: 60px;
      box-shadow: 0 10px 0 #d98a9b;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.1s;
      letter-spacing: 2px;
    }

    .create-room-btn:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #d98a9b;
    }

    /* 词卡区域 */
    .word-section {
      background: #fffafc;
      border-radius: 32px;
      padding: 22px 16px;
      margin-bottom: 20px;
      border: 3px solid #ffe1e8;
      box-shadow: inset 0 0 0 4px #ffffff;
    }

    .turn-indicator {
      font-size: 0.95rem;
      color: #ff8da1;
      font-weight: 600;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .round-badge {
      background: #ffcad4;
      padding: 4px 14px;
      border-radius: 30px;
      color: #a34e62;
      font-weight: 700;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .word-input {
      width: 100%;
      padding: 18px 20px;
      border-radius: 60px;
      border: 3px solid #ffb7c5;
      background: white;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
      color: #5e3e4a;
      font-weight: 500;
      letter-spacing: 1px;
      transition: 0.2s;
    }

    .word-input:focus {
      border-color: #ff6f91;
      box-shadow: 0 0 0 6px #ffe2e9;
    }

    .word-input::placeholder {
      color: #dbb7c1;
      font-size: 1rem;
      font-weight: 400;
    }

    .submit-btn {
      background: #8bd3dd;
      color: #1e5c67;
      font-size: 1.1rem;
      padding: 16px;
      box-shadow: 0 6px 0 #6baeb8;
      border: 2px solid #c1ecf2;
    }

    .submit-btn:active {
      box-shadow: 0 2px 0 #6baeb8;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 2px 0 #6baeb8;
      pointer-events: none;
    }

    /* 上一轮结果 */
    .last-round-box {
      background: #fff2f6;
      border-radius: 28px;
      padding: 16px 18px;
      margin-top: 18px;
      border-left: 8px solid #ffb7c5;
      font-size: 1rem;
      color: #6e4a56;
    }

    .last-round-title {
      font-weight: 700;
      color: #ff6f91;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .last-round-words {
      display: flex;
      justify-content: space-around;
      background: #ffeef2;
      border-radius: 40px;
      padding: 10px;
      font-weight: 600;
    }

    .last-round-words span {
      background: white;
      padding: 6px 18px;
      border-radius: 40px;
      box-shadow: 0 2px 6px #ffd9e2;
      color: #b3536b;
      min-width: 80px;
      text-align: center;
    }

    /* 按钮区域 */
    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .agree-btn {
      background: #b0e9ca;
      color: #2a6b4b;
      padding: 16px 20px;
      flex: 1;
      font-size: 1rem;
      box-shadow: 0 6px 0 #86c9a8;
      border: 2px solid #d3f7e6;
    }

    .agree-btn:active {
      box-shadow: 0 2px 0 #86c9a8;
    }

    .restart-btn {
      background: #ffd966;
      color: #8a5d1a;
      padding: 16px 20px;
      flex: 1;
      font-size: 1rem;
      box-shadow: 0 6px 0 #dbb84a;
      border: 2px solid #fff1b8;
    }

    .restart-btn:active {
      box-shadow: 0 2px 0 #dbb84a;
    }

    /* 历史记录 / 结束界面 */
    .history-panel {
      background: #fff5f8;
      border-radius: 32px;
      padding: 22px 16px;
      margin-top: 18px;
      border: 2px solid #ffd9e2;
    }

    .history-title {
      font-size: 1.3rem;
      color: #ff6f91;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .history-item {
      background: white;
      padding: 12px 16px;
      border-radius: 30px;
      display: flex;
      justify-content: space-between;
      font-weight: 500;
      color: #694e58;
      box-shadow: 0 4px 6px #ffe2ea;
      border: 1px solid #ffe2ea;
    }

    .history-item .round-num {
      color: #ff8da1;
      font-weight: 700;
      margin-right: 12px;
    }

    .history-item .words {
      display: flex;
      gap: 8px;
    }

    .history-item .words span {
      background: #fef0f4;
      padding: 4px 14px;
      border-radius: 30px;
      color: #b3536b;
      font-weight: 600;
    }

    .success-message {
      text-align: center;
      font-size: 1.5rem;
      color: #ff6f91;
      font-weight: 800;
      margin-bottom: 16px;
      text-shadow: 0 4px 8px #ffd3df;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .again-btn {
      background: #ffb6c1;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1.3rem;
      padding: 18px;
      width: 100%;
      border-radius: 60px;
      box-shadow: 0 10px 0 #d98a9b;
      margin-top: 16px;
      cursor: pointer;
      transition: all 0.1s;
      letter-spacing: 2px;
    }

    .again-btn:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #d98a9b;
    }

    .hidden {
      display: none !important;
    }

    /* 提示信息 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffb6c1;
      color: white;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 40px;
      box-shadow: 0 10px 20px #fbb6c2;
      transition: 0.3s;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      bottom: 50px;
    }

    /* 等待对方状态 */
    .waiting-tip {
      font-size: 0.9rem;
      color: #cd8b9c;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="game-container" id="gameContainer">
    <!-- 主标题 -->
    <h1>
      <span>🌸</span> 同词相遇 <span>🌸</span>
    </h1>
    <div class="subhead">✨ 心有灵犀一点通 ✨</div>

    <!-- 创建房间按钮（初始显示） -->
    <button class="create-room-btn" id="createRoomBtn">🏠 创建房间</button>

    <!-- 房间区域（创建后显示） -->
    <div id="roomArea" class="room-area hidden">
      <div class="room-info">
        <div class="room-badge" id="roomIdDisplay">房间: ---</div>
        <button class="invite-btn" id="inviteBtn">📋 邀请好友</button>
      </div>
      <div style="font-size:0.8rem; color:#b68b9c; width:100%; margin-top:8px;">点击邀请自动复制链接</div>
    </div>

    <!-- 游戏主区域 -->
    <div id="gamePlayArea" class="hidden">
      <!-- 回合 & 输入区 -->
      <div class="word-section">
        <div class="turn-indicator">
          <span class="round-badge" id="roundCounter">第 1 轮</span>
          <span id="playerStatus">等待输入...</span>
        </div>
        <div class="input-group">
          <input type="text" class="word-input" id="wordInput" placeholder="输入你的词..." maxlength="20" autocomplete="off">
          <button class="submit-btn" id="submitWordBtn">提交 ✨</button>
        </div>

        <!-- 上一轮结果 -->
        <div class="last-round-box" id="lastRoundBox">
          <div class="last-round-title"><span>🕊️</span> 上一轮输入</div>
          <div class="last-round-words">
            <span id="lastP1Word">——</span>
            <span>💞</span>
            <span id="lastP2Word">——</span>
          </div>
        </div>
      </div>

      <!-- 操作按钮：认为相同 / 重新开始 -->
      <div class="action-buttons">
        <button class="agree-btn" id="agreeBtn">✅ 认为词一样</button>
        <button class="restart-btn" id="restartRoundBtn">🔄 重新开始</button>
      </div>

      <!-- 历史记录 & 胜利界面 -->
      <div class="history-panel" id="historyPanel">
        <div class="history-title"><span>📜</span> 相遇轨迹 <span>📜</span></div>
        <div class="history-list" id="historyList">
          <!-- 动态渲染历史 -->
        </div>
        <div id="successMessage" class="success-message hidden"></div>
        <button id="againBtn" class="again-btn hidden">🌸 再来一把</button>
      </div>
    </div>

    <!-- 小提示浮层 -->
    <div class="toast" id="toast"></div>
  </div>

  <script>
    (function() {
      // ---------- 游戏状态 ----------
      // 使用 localStorage 模拟双方数据同步 (同浏览器内多个标签页)
      // 但为了在单一页面也能完整演示，内部维护虚拟对手（如果只有一个玩家，模拟另一个玩家自动随机）
      // 但为了真实双人体验，我们使用 localStorage 跨标签通信。同一浏览器下打开两个页面即可。

      // 核心存储键名
      const STORAGE_KEY = 'tongci_xiangyu_game';

      // 当前页面的玩家身份: 'p1' 或 'p2' (通过 URL 参数区分)
      let myRole = 'p1'; // 默认房主 p1

      // 游戏状态 (从 localStorage 读取)
      let gameState = {
        roomId: '',
        round: 1,
        // 当前轮是否已提交
        p1Submitted: false,
        p2Submitted: false,
        p1Word: '',
        p2Word: '',
        // 上一轮展示 (上一轮双方词)
        lastP1: '',
        lastP2: '',
        // 历史记录 [{round, p1, p2}]
        history: [],
        // 游戏是否结束 (成功相遇)
        gameOver: false,
        // 认为词一样的标记 (用于触发结束)
        forceAgree: false,
        // 创建房间时间戳 (用于邀请)
        createdAt: Date.now()
      };

      // DOM 元素
      const createRoomBtn = document.getElementById('createRoomBtn');
      const roomArea = document.getElementById('roomArea');
      const roomIdDisplay = document.getElementById('roomIdDisplay');
      const inviteBtn = document.getElementById('inviteBtn');
      const gamePlayArea = document.getElementById('gamePlayArea');
      const roundCounter = document.getElementById('roundCounter');
      const playerStatus = document.getElementById('playerStatus');
      const wordInput = document.getElementById('wordInput');
      const submitWordBtn = document.getElementById('submitWordBtn');
      const lastP1Word = document.getElementById('lastP1Word');
      const lastP2Word = document.getElementById('lastP2Word');
      const agreeBtn = document.getElementById('agreeBtn');
      const restartRoundBtn = document.getElementById('restartRoundBtn');
      const historyList = document.getElementById('historyList');
      const successMessage = document.getElementById('successMessage');
      const againBtn = document.getElementById('againBtn');
      const toast = document.getElementById('toast');
      const historyPanel = document.getElementById('historyPanel');

      // ---------- 辅助函数 ----------
      // 显示浮层提示
      function showToast(msg, duration = 2000) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, duration);
      }

      // 生成随机房间号 (6位)
      function generateRoomId() {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
      }

      // 保存状态到 localStorage
      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
      }

      // 从 localStorage 加载状态 (并更新 UI)
      function loadState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            // 检查房间是否存在且未过期 (简单处理)
            if (parsed && parsed.roomId) {
              gameState = parsed;
            }
          } catch (e) {}
        }
        updateUI();
      }

      // 检测 URL 参数，确定角色
      function detectRole() {
        const params = new URLSearchParams(window.location.search);
        const roomParam = params.get('room');
        if (roomParam) {
          // 如果 URL 中有房间号，则作为 p2 加入
          myRole = 'p2';
          // 如果本地没有这个房间，或者房间号不同，则重置
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              if (parsed.roomId !== roomParam) {
                // 房间号不匹配，但还是要进入房间? 我们可以尝试加入新房间，但为了简单，将房间号强制设为这个
                // 这里我们给一个友好提示并允许创建同名房间 (实际中应由房主创建)
                // 但为了演示，若房间不存在则自动创建并把自己当做p1? 但URL已指定p2，我们直接创建一个等待房主的状态
                gameState = {
                  ...gameState,
                  roomId: roomParam,
                  round: 1,
                  p1Submitted: false,
                  p2Submitted: false,
                  p1Word: '',
                  p2Word: '',
                  lastP1: '',
                  lastP2: '',
                  history: [],
                  gameOver: false,
                  forceAgree: false,
                  createdAt: Date.now()
                };
                saveState();
              }
            } catch (e) {}
          } else {
            // 无状态，但URL有房间号，视为加入；创建一个状态但标记myRole=p2
            gameState = {
              ...gameState,
              roomId: roomParam,
              round: 1,
              p1Submitted: false,
              p2Submitted: false,
              p1Word: '',
              p2Word: '',
              lastP1: '',
              lastP2: '',
              history: [],
              gameOver: false,
              forceAgree: false,
              createdAt: Date.now()
            };
            saveState();
          }
          // 如果房间号存在，显示房间
          roomArea.classList.remove('hidden');
          createRoomBtn.classList.add('hidden');
          gamePlayArea.classList.remove('hidden');
          roomIdDisplay.textContent = `房间: ${gameState.roomId}`;
        } else {
          // 无房间参数，作为 p1 (如果之前有房间也可继续)
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              if (parsed.roomId) {
                // 已有房间，自动进入
                gameState = parsed;
                myRole = 'p1'; // 假设同一浏览器第一个是p1
                roomArea.classList.remove('hidden');
                createRoomBtn.classList.add('hidden');
                gamePlayArea.classList.remove('hidden');
                roomIdDisplay.textContent = `房间: ${gameState.roomId}`;
              }
            } catch (e) {}
          }
        }
        updateUI();
      }

      // 更新界面
      function updateUI() {
        // 如果游戏已结束，显示结束界面
        if (gameState.gameOver) {
          // 隐藏输入区域的一些交互元素，但保留历史
          wordInput.disabled = true;
          submitWordBtn.disabled = true;
          agreeBtn.classList.add('hidden');
          restartRoundBtn.classList.add('hidden');
          successMessage.classList.remove('hidden');
          const rounds = gameState.history.length;
          successMessage.innerHTML = `🎉 成功相遇！ 🎉<br><span style="font-size:1rem;">经过 ${rounds} 轮，你们选择了相同的词</span>`;
          againBtn.classList.remove('hidden');
          // 显示历史
          renderHistory();
          return;
        } else {
          wordInput.disabled = false;
          submitWordBtn.disabled = false;
          agreeBtn.classList.remove('hidden');
          restartRoundBtn.classList.remove('hidden');
          successMessage.classList.add('hidden');
          againBtn.classList.add('hidden');
        }

        // 显示回合
        roundCounter.textContent = `第 ${gameState.round} 轮`;

        // 更新上一轮显示
        lastP1Word.textContent = gameState.lastP1 || '——';
        lastP2Word.textContent = gameState.lastP2 || '——';

        // 判断当前玩家是否已提交
        const iAmP1 = myRole === 'p1';
        const mySubmitted = iAmP1 ? gameState.p1Submitted : gameState.p2Submitted;
        const otherSubmitted = iAmP1 ? gameState.p2Submitted : gameState.p1Submitted;

        // 更新状态提示
        if (!mySubmitted && !otherSubmitted) {
          playerStatus.textContent = '轮到你了，输入一个词吧';
        } else if (mySubmitted && !otherSubmitted) {
          playerStatus.textContent = '✅ 你已提交，等待对方...';
        } else if (!mySubmitted && otherSubmitted) {
          playerStatus.textContent = '⏳ 对方已提交，等你啦';
        } else {
          playerStatus.textContent = '✨ 双方已提交，可以揭晓/下一轮';
        }

        // 如果双方都已提交，显示双方词 (但根据规则，提交后能看到对方的词? 实际上规则: "都提交后才能看见对方的词"，所以一旦双方提交，我们就把对方的词显示出来)
        // 另外，如果当前玩家未提交，但对方已提交，我们不显示对方的词 (隐私)
        // 但游戏体验: 一旦双方提交，就把双方词显示在上一轮区域? 但上一轮是上一轮的结果，当前轮还没结束
        // 我们可以让"上一轮"区域只显示历史，而当前轮的双词在双方提交后通过某种方式展示? 但规则说"都提交后才能看见对方的词"，我们可以在历史或单独区域展示？
        // 这里为了简洁，我们在双方都提交后，把当前词立刻显示在输入框下方? 但设计上"上一轮"是显示上一轮结果。可以在提交按钮下方临时展示本轮的词。
        // 但为了简化，我们使用lastRoundBox显示上一轮；当双方都提交时，我们直接将本轮结果展示出来并自动判断是否相同？或者交给"认为词一样"按钮？
        // 规则: 都提交后才能看见对方的词。若一样，则成功；若不一样，则双方再次输入一个词。所以应该在双方提交后立即展示双方词并提示是否相同，然后可以点击"认为词一样"或"重新开始"？
        // 但为了确保用户能看清，我们设计: 双方提交后，把双方本轮词展示在"上一轮"区域? 但那是上一轮。
        // 调整: 如果双方都已提交，且未结束，我们临时在lastRoundBox显示本轮词？这样会覆盖上一轮。但为了清晰，我们再开一个区域? 简单起见，我们直接在"上一轮"区域显示当前轮的结果，因为上一轮会在进入下一轮时更新。
        // 这样更好: 每次提交完成后，如果双方都提交，显示双方词，并等待"认为词一样"或"重新开始"。
        // 所以我们动态修改: 如果双方都提交了，lastP1Word显示当前p1Word，lastP2Word显示当前p2Word，并加个提示。
        if (gameState.p1Submitted && gameState.p2Submitted) {
          // 双方都已提交，显示双方本轮词
          lastP1Word.textContent = gameState.p1Word || '——';
          lastP2Word.textContent = gameState.p2Word || '——';
          // 检测是否相同
          if (gameState.p1Word.trim() !== '' && gameState.p2Word.trim() !== '' && gameState.p1Word.trim() === gameState.p2Word.trim()) {
            // 自动结束? 但规则说"若输入的词一样，则成功"，我们可以在双方提交后自动判断相同，并显示成功。
            // 但需要记录历史，并且游戏结束。
            if (!gameState.gameOver) {
              // 添加历史
              const historyItem = {
                round: gameState.round,
                p1: gameState.p1Word,
                p2: gameState.p2Word
              };
              gameState.history.push(historyItem);
              gameState.gameOver = true;
              // 更新上一轮
              gameState.lastP1 = gameState.p1Word;
              gameState.lastP2 = gameState.p2Word;
              saveState();
              updateUI();
              showToast('🎉 你们选择了相同的词！游戏结束');
              return;
            }
          }
        } else {
          // 如果还没双方提交，保持显示上一轮
          lastP1Word.textContent = gameState.lastP1 || '——';
          lastP2Word.textContent = gameState.lastP2 || '——';
        }

        // 根据已提交状态禁用输入框
        if (mySubmitted) {
          wordInput.disabled = true;
          submitWordBtn.disabled = true;
        } else {
          wordInput.disabled = false;
          submitWordBtn.disabled = false;
        }

        // 渲染历史
        renderHistory();
      }

      // 渲染历史记录
      function renderHistory() {
        historyList.innerHTML = '';
        if (gameState.history.length === 0) {
          historyList.innerHTML = '<div style="text-align:center; color:#dbb7c1; padding:12px;">还没有记录，开始第一轮吧 ✨</div>';
        } else {
          gameState.history.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
              <span><span class="round-num">第${item.round}轮</span></span>
              <span class="words">
                <span>${item.p1 || '——'}</span>
                <span>💞</span>
                <span>${item.p2 || '——'}</span>
              </span>
            `;
            historyList.appendChild(div);
          });
        }
      }
