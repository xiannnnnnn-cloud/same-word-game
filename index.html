<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接同词相遇</title>
  <!-- 引入 MQTT 库，用来联机同步 -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #fff7e6;
      padding: 32px 20px;
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      color: #ff7b9c;
      margin-bottom: 6px;
    }

    .tip {
      color: #777;
      margin-bottom: 22px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 8px 22px rgba(255, 123, 156, 0.12);
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      padding: 13px 26px;
      border: none;
      border-radius: 999px;
      background-color: #ff8fab;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      background-color: #ff7096;
      transform: translateY(-2px);
    }

    .btn.secondary {
      background-color: #ffeef3;
      color: #ff6b8f;
    }

    .btn:disabled {
      background-color: #ffdce6;
      cursor: not-allowed;
      transform: none;
    }

    .row {
      margin: 18px 0;
    }

    .row label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #444;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid #ffe0e8;
      border-radius: 20px;
      font-size: 16px;
      background-color: #fff8fa;
    }

    input:focus {
      outline: none;
      border-color: #ff8fab;
    }

    .countdown-box {
      text-align: center;
      padding: 20px;
      background-color: #fff0b8;
      border-radius: 22px;
      margin-bottom: 20px;
    }

    #timerText {
      font-size: 42px;
      color: #d68c00;
      font-weight: bold;
    }

    .log-title {
      margin-bottom: 10px;
      font-weight: 600;
    }

    .log-box {
      height: 220px;
      overflow-y: auto;
      border: 2px solid #ffe6ed;
      border-radius: 20px;
      padding: 16px;
      background-color: #fff8fa;
    }

    .log-item {
      margin-bottom: 11px;
      padding: 12px;
      border-radius: 18px;
      background-color: #fff;
      border-left: 5px solid #ffb8cc;
    }

    .success-item {
      border-left-color: #70d6a3;
      background-color: #f0fff6;
    }

    .msg-tip {
      margin-top: 14px;
      min-height: 28px;
      color: #2b9b49;
    }

    .warn-box {
      padding: 16px;
      background-color: #eef7ff;
      border-radius: 20px;
      color: #3b72b8;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- 开始页：创建 / 输入房间 -->
  <section id="startPage" class="card">
    <h1>接同词相遇 ✨</h1>
    <p class="tip">和好友输入一样的词，相遇就算成功！</p >

    <div class="row">
      <button id="createRoomBtn" class="btn">创建新房间</button>
    </div>

    <div class="row">
      <label>或者输入房间号加入</label>
      <div class="input-wrap">
        <input id="joinRoomInput" placeholder="例如：A123">
        <button id="joinRoomBtn" class="btn secondary">加入房间</button>
      </div>
    </div>
  </section>

  <!-- 房间页面 -->
  <section id="roomPage" class="card hidden">
    <div class="row">
      <label>房间链接（发给好友）</label>
      <div class="input-wrap">
        <input id="shareLink" readonly>
        <button id="copyLinkBtn" class="btn secondary">复制链接</button>
      </div>
      <div id="copyTip" class="msg-tip"></div>
    </div>

    <div class="countdown-box">
      <div id="timerText">60</div>
      <p id="timerLabel">剩余时间（本轮）</p >
    </div>

    <div class="row">
      <label>输入你的词语</label>
      <div class="input-wrap">
        <input id="wordInput" placeholder="在这里输入词语">
        <button id="submitBtn" class="btn">提交</button>
      </div>
    </div>

    <div class="row">
      <div class="log-title">所有提交记录</div>
      <div id="logBox" class="log-box"></div>
    </div>

    <div class="row">
      <button id="restartBtn" class="btn secondary">重新开始游戏</button>
    </div>

    <div class="warn-box">
      ⚠️ 使用公共 MQTT 测试联机；仅适合体验，如果服务下线就无法同步。
    </div>
  </section>

  <script>
    // 获取页面元素
    const startPage = document.getElementById('startPage');
    const roomPage = document.getElementById('roomPage');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomInput = document.getElementById('joinRoomInput');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const shareLink = document.getElementById('shareLink');
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    const copyTip = document.getElementById('copyTip');
    const timerText = document.getElementById('timerText');
    const timerLabel = document.getElementById('timerLabel');
    const wordInput = document.getElementById('wordInput');
    const submitBtn = document.getElementById('submitBtn');
    const logBox = document.getElementById('logBox');
    const restartBtn = document.getElementById('restartBtn');

    // MQTT 公共中继
    const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
    let mqttClient = null;
    let roomCode = '';
    let topic = '';
    let countdownTimer = null;
    let remainSeconds = 60;
    let myWord = '';
    let otherWord = '';
    let gameEnded = false;

    /**
     * 生成房间号：一个大写字母 + 三位数字
     */
    function makeRoomCode() {
      const letter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
      const num = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
      return letter + num;
    }

    /**
     * 添加一条日志记录
     * @param text - 显示文字
     * @param isSuccess - 是否是成功相遇
     */
    function addLog(text, isSuccess = false) {
      const item = document.createElement('div');
      item.className = 'log-item';
      if (isSuccess) item.classList.add('success-item');
      item.textContent = text;
      logBox.appendChild(item);
      logBox.scrollTop = logBox.scrollHeight;
    }

    /**
     * 切换页面到房间
     */
    function showRoom() {
      startPage.classList.add('hidden');
      roomPage.classList.remove('hidden');
    }

    /**
     * 返回首页，关闭连接
     */
    function backToStart() {
      startPage.classList.remove('hidden');
      roomPage.classList.add('hidden');
      if (mqttClient) {
        mqttClient.end();
        mqttClient = null;
      }
      resetGame();
    }

    /**
     * 重置本局游戏状态
     */
    function resetGame() {
      clearInterval(countdownTimer);
      remainSeconds = 60;
      myWord = '';
      otherWord = '';
      gameEnded = false;
      logBox.innerHTML = '';
      wordInput.value = '';
      submitBtn.disabled = false;
      updateTimerUI();
    }
