<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同词游戏｜联机房间</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      padding: 40px 20px;
      max-width: 680px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 8px;
      color: #222;
    }
    .tip {
      color: #666;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      background-color: #4080ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover {
      background-color: #2e6ee8;
    }
    .btn.secondary {
      background-color: white;
      color: #333;
      border: 1px solid #dcdfe6;
    }
    .hidden {
      display: none !important;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }
    .link-row {
      margin: 20px 0;
    }
    .link-row label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .link-wrap {
      display: flex;
      gap: 10px;
    }
    input#shareLink {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #dcdfe6;
      border-radius: 10px;
      font-size: 15px;
    }
    .message {
      margin-top: 16px;
      min-height: 26px;
      color: #2b9b49;
    }
    .warn {
      margin-top: 20px;
      padding: 16px;
      background-color: #eef4ff;
      border-radius: 12px;
      color: #2c5ea8;
    }
    .log-box {
      margin-top: 20px;
      height: 220px;
      overflow-y: auto;
      border: 1px solid #dcdfe6;
      border-radius: 12px;
      padding: 14px;
      background: #f8f9fb;
    }
    .log-item {
      margin-bottom: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- 创建 / 加入页 -->
  <section id="startPage" class="card">
    <h1>创建或加入联机房间</h1>
    <p class="tip">生成房间链接发给朋友，同一房间实时互通</p >
    <button id="createRoomBtn" class="btn">创建新房间</button>
  </section>

  <!-- 房间页 -->
  <section id="roomPage" class="card hidden">
    <h1>房间已连接</h1>
    <p class="tip">把链接发给好友打开，自动进同一个房间</p >

    <div class="link-row">
      <label>房间链接</label>
      <div class="link-wrap">
        <input id="shareLink" readonly>
        <button id="copyBtn" class="btn">复制链接</button>
      </div>
    </div>
    <div id="copyMsg" class="message"></div>

    <div class="warn">
      ✅ 使用公共 MQTT 中继实现跨设备联机；数据经过公共服务器，不要发送敏感内容。如果中继服务下线，联机就会失效。
    </div>

    <div class="link-row">
      <label>房间消息日志</label>
      <div id="logBox" class="log-box"></div>
    </div>

    <div class="link-row">
      <label>发送测试消息（同步给所有人）</label>
      <div class="link-wrap">
        <input id="sendInput" placeholder="输入消息">
        <button id="sendBtn" class="btn">发送</button>
      </div>
    </div>

    <div style="margin-top:24px;">
      <button id="backBtn" class="btn secondary">返回，退出房间</button>
    </div>
  </section>

  <script>
    const startPage = document.getElementById('startPage');
    const roomPage = document.getElementById('roomPage');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const shareLinkInput = document.getElementById('shareLink');
    const copyBtn = document.getElementById('copyBtn');
    const copyMsg = document.getElementById('copyMsg');
    const backBtn = document.getElementById('backBtn');
    const logBox = document.getElementById('logBox');
    const sendInput = document.getElementById('sendInput');
    const sendBtn = document.getElementById('sendBtn');

    let client = null;
    let roomId = '';
    const broker = 'wss://broker.hivemq.com:8884/mqtt';

    function genRoomId(len = 8) {
      const chars = 'abcdefghijkmnpqrstuvwxyz0123456789';
      let id = '';
      for (let i = 0; i < len; i++) {
        id += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return id;
    }

    function log(text) {
      const p = document.createElement('div');
      p.className = 'log-item';
      p.textContent = text;
      logBox.appendChild(p);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function showStartPage() {
      startPage.classList.remove('hidden');
      roomPage.classList.add('hidden');
      if (client) {
        client.end();
        client = null;
      }
    }

    function showRoomPage(url) {
      shareLinkInput.value = url;
      copyMsg.textContent = '';
      logBox.innerHTML = '';
      startPage.classList.add('hidden');
      roomPage.classList.remove('hidden');
    }

    async function connectRoom(rid) {
      roomId = rid;
      const topic = `game/room/${roomId}`;
      const url = location.origin + location.pathname + '?room=' + roomId;
      showRoomPage(url);

      try {
        client = mqtt.connect(broker, {
          clientId: 'game_' + Math.random().toString(36).substr(2, 10)
        });

        client.on('connect', () => {
          log('✅ 已连上联机服务器，房间：' + roomId);
          client.subscribe(topic);
          publishMsg('有人加入房间');
        });

        client.on('message', (_, raw) => {
          log('📩 ' + raw.toString());
        });

        client.on('error', (err) => {
          log('❌ 连接出错：' + err.message);
        });

        client.on('close', () => {
          log('🔌 连接已断开');
        });
      } catch (e) {
        log('❌ 创建连接失败：' + e.message);
      }
    }

    function publishMsg(txt) {
      if (!client) return;
      const topic = `game/room/${roomId}`;
      client.publish(topic, txt);
    }

    // 创建房间
    createRoomBtn.addEventListener('click', () => {
      const rid = genRoomId();
      connectRoom(rid);
    });

    // 返回
    backBtn.addEventListener('click', showStartPage);

    // 复制链接
    copyBtn.addEventListener('click', async () => {
      const text = shareLinkInput.value;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        copyMsg.textContent = '✅ 复制成功！';
      } catch {
        shareLinkInput.select();
        copyMsg.setSelectionRange(0, 99999);
        copyMsg.textContent = '❌ 自动复制失败，请手动复制';
      }
    });

    // 发送消息
    sendBtn.addEventListener('click', () => {
      const val = sendInput.value.trim();
      if (!val) return;
      publishMsg(val);
      sendInput.value = '';
    });

    // 如果打开带 room 参数，直接进房间
    const params = new URLSearchParams(location.search);
    const joinId = params.get('room');
    if (joinId) {
      connectRoom(joinId);
    }
  </script>
</body>
</html>
