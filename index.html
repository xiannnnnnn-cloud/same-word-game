<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接同词相遇</title>
  <!-- MQTT 公共中继，用来联机同步 -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #fff7e6;
      padding: 32px 20px;
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      color: #ff7b9c;
      margin-bottom: 6px;
    }

    .tip {
      color: #777;
      margin-bottom: 22px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 8px 22px rgba(255, 123, 156, 0.12);
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      padding: 13px 26px;
      border: none;
      border-radius: 999px;
      background-color: #ff8fab;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      background-color: #ff7096;
      transform: translateY(-2px);
    }

    .btn.secondary {
      background-color: #ffeef3;
      color: #ff6b8f;
    }

    .btn:disabled {
      background-color: #ffdce6;
      cursor: not-allowed;
      transform: none;
    }

    .row {
      margin: 18px 0;
    }

    .row label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #444;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid #ffe0e8;
      border-radius: 20px;
      font-size: 16px;
      background-color: #fff8fa;
    }

    input:focus {
      outline: none;
      border-color: #ff8fab;
    }

    .countdown-box {
      text-align: center;
      padding: 20px;
      background-color: #fff0b8;
      border-radius: 22px;
      margin-bottom: 20px;
    }

    #timerText {
      font-size: 42px;
      color: #d68c00;
      font-weight: bold;
    }

    .prev-round-box {
      background-color: #ffeef6;
      border: 2px solid #ffdce8;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .success-count-box {
      background-color: #e8f9ef;
      border: 2px solid #bcefd4;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
      color: #2b9b49;
      font-weight: bold;
    }

    .log-title {
      margin-bottom: 10px;
      font-weight: 600;
    }

    .log-box {
      height: 220px;
      overflow-y: auto;
      border: 2px solid #ffe6ed;
      border-radius: 20px;
      padding: 16px;
      background-color: #fff8fa;
    }

    .log-item {
      margin-bottom: 11px;
      padding: 12px;
      border-radius: 18px;
      background-color: #fff;
      border-left: 5px solid #ffb8cc;
    }

    .success-item {
      border-left-color: #70d6a3;
      background-color: #f0fff6;
    }

    .msg-tip {
      margin-top: 14px;
      min-height: 28px;
      color: #2b9b49;
    }

    .warn-box {
      padding: 16px;
      background-color: #eef7ff;
      border-radius: 20px;
      color: #3b72b8;
      margin-top: 20px;
    }

    /* 弹窗遮罩 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal {
      width: min(92%, 560px);
      background: white;
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(255, 123, 156, 0.18);
    }

    .modal h2 {
      color: #ff7b9c;
      margin-bottom: 12px;
    }

    .modal small {
      color: #777;
    }
  </style>
</head>
<body>
  <!-- 创建房间弹窗 -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2>房间已创建 ✨</h2>
      <small>把链接或者房间号发给好友，让对方加入</small>

      <div class="row">
        <label>房间号</label>
        <input id="modalRoomCode" readonly>
      </div>

      <div class="row">
        <label>房间链接</label>
        <div class="input-wrap">
          <input id="modalLink" readonly>
          <button id="modalCopyBtn" class="btn secondary">复制</button>
        </div>
        <div id="modalTip" class="msg-tip"></div>
      </div>

      <div class="row">
        <button id="modalCloseBtn" class="btn">确定，进入房间</button>
      </div>
    </div>
  </div>

  <!-- 起始页 -->
  <section id="startPage" class="card">
    <h1>接同词相遇 ✨</h1>
    <p class="tip">两个人都进房间，一起提交词语，看看能不能对上！</p >

    <div class="row">
      <button id="createRoomBtn" class="btn">创建房间</button>
    </div>

    <div class="row">
      <label>或者输入房间号加入</label>
      <div class="input-wrap">
        <input id="joinRoomInput" placeholder="例如：A123">
        <button id="joinRoomBtn" class="btn secondary">加入房间</button>
      </div>
    </div>
  </section>

  <!-- 房间页面 -->
  <section id="roomPage" class="card hidden">
    <div class="countdown-box">
      <div id="timerText">60</div>
      <p id="timerLabel">等待另一位玩家进入房间</p >
    </div>

    <!-- “累计成功相遇”提示 -->
    <div id="successCountBox" class="success-count-box hidden">
      🎉 累计成功相遇：<span id="successCountNum">0</span> 次
    </div>

    <!-- “上一轮记录”，没对上时显示 -->
    <div id="prevRoundBox" class="prev-round-box hidden">
      <label>上一轮（没对上）</label>
      <div id="prevRoundText"></div>
    </div>

    <!-- “输入区域”，两人都进来才显示 -->
    <div id="gameInputWrap" class="row hidden">
      <label>输入你的词语</label>
      <div class="input-wrap">
        <input id="wordInput" placeholder="在这里输入词语">
        <button id="submitBtn" class="btn">提交</button>
      </div>
    </div>

    <div class="row">
      <div class="log-title">每一轮记录（全部保留）</div>
      <div id="logBox" class="log-box"></div>
    </div>

    <div class="row">
      <button id="restartBtn" class="btn secondary">重新开始游戏</button>
    </div>

    <div class="warn-box">
      ⚠️ 使用公共 MQTT 测试联机；仅适合体验，如果服务下线就无法同步。
    </div>
  </section>

    const modalCloseBtn = document.getElementById('modalCloseBtn');

    const startPage = document.getElementById('startPage');
    const roomPage = document.getElementById('roomPage');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomInput = document.getElementById('joinRoomInput');

    const timerText = document.getElementById('timerText');
    const timerLabel = document.getElementById('timerLabel');
